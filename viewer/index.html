      // readout was therefore absent or wrong for almost every click.
      const dx = (r.cx - (originX || 0)) - p.x;
      const dy = (r.cy - (originY || 0)) - p.z;
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = r; }
    }
    if (best && bestD < 40 * 40) {
      const q = best.props;
      const ev = q.evidence || {};
      const bar = (v) => {
        const n = Math.max(0, Math.min(5, Math.round((v || 0) * 5)));
        return "#".repeat(n) + ".".repeat(5 - n);
      };
      label += "\n\nWHY THIS HEIGHT";
      label += "\nreliability   " + (q.reliability || "n/a")
             + "   provenance " + (q.provenance || "n/a");
      if (q.confidence_px !== undefined && q.confidence_px !== null) {
        label += "\nphotometric   " + bar(q.confidence_px)
               + "  " + q.confidence_px.toFixed(2);
      }
      label += "\nheight cue    " + bar(ev.height) + "  " + (ev.height ?? "-");
      label += "\nroof edge     " + bar(ev.edge) + "  " + (ev.edge ?? "-");
      label += "\ntexture       " + bar(ev.texture) + "  " + (ev.texture ?? "-");
      label += "\nshadow        " + bar(ev.shadow) + "  " + (ev.shadow ?? "-");
      label += "\nfootprint     " + (q.area_m2 ?? "-") + " m2, "
             + (q.size_class || "-");
      // Conformal interval, when the scene earned one. Shown as the claim it
      // actually is -- a value, a band, and the rate that band holds at --
      // rather than a bare +- number whose meaning the reader has to guess.
      // Absent on a relative-scale scene by construction: the pipeline does
      // not attach metre bands to heights that are not in metres.
      if (q.interval_half_width_m !== undefined && q.interval_half_width_m !== null) {
        const hw = q.interval_half_width_m;
        const pct = Math.round((q.coverage_nominal ?? 0.9) * 100);
        // The RECORD's height, not the clicked point's `h`. Clicking a roof
        // edge and clicking its centre give different `h`, but the interval
        // was fitted against the building's recorded height -- pairing the
        // band with whatever the cursor happened to hit would misstate it.
        const bh = q.height_m;
        label += "\ninterval      " + (bh === undefined || bh === null ? "?" : bh.toFixed(1))
               + " m  +/-" + hw.toFixed(1) + " m   (true value inside "
               + pct + "% of the time)";
      } else if (q.height_is_metric) {
        label += "\ninterval      none (no fitted quantile committed)";
      }
      label += q.height_is_metric
             ? "\nheight is MEASURED (metric scale established)"
             : "\nheight is INFERRED (relative scale, not measured)";
    }
  }
  panel.textContent = label;
});


// --- Ground control: scale the scene from known building heights ------------
//
// The fourth scale route named by the problem statement, and the only one an
// operator can use on a scene that has no DEM, no archive views and no usable
// shadows. Click a building, type what it really is, repeat, solve.
//
// This is a PORT of calibration/gcp.py and must stay in step with it. The
// viewer is a static page with no backend, so the solve happens here; the
// Python module is the reference implementation and carries the reasoning.
//
// Ratio of medians, not median of ratios. Each point gives a ratio
// known/measured, and taking the median of those weights a 4 m shed exactly as
// heavily as a 120 m tower -- but the shed's ratio is dominated by a metre of
// pipeline noise. Measured on the two-point case in the Python tests: the same
// pair gives 120.9 m for the tower under ratio-of-medians and 138.7 m under
// median-of-ratios.
const GCP_MIN_MEASURED = 1.0;
const GCP_SUSPECT_FRAC = 0.25;

let gcpActive = false;
let gcpPoints = [];          // {id, measured, known, x, z, marker}
let gcpApplied = null;       // the factor currently applied, if any

// Ordinary least squares for known=a*measured^b via y=ln(known), x=ln(measured),
// y = b*x + ln(a). Returns null on a degenerate (near-zero-variance) x, same
// guard the caller already had.
function fitPowerLaw(usable) {
  const xs = usable.map((p) => Math.log(p.measured));
  const ys = usable.map((p) => Math.log(p.known));
  const n = xs.length;
  const xbar = xs.reduce((s, v) => s + v, 0) / n;
  const ybar = ys.reduce((s, v) => s + v, 0) / n;
  let num = 0, den = 0;
  for (let i = 0; i < n; i++) { num += (xs[i] - xbar) * (ys[i] - ybar); den += (xs[i] - xbar) ** 2; }
  if (den < 1e-9) return null;
  const b = num / den;
  const a = Math.exp(ybar - b * xbar);
  return { a, b, xbar, xvar: den / n };
}

// Condition number of the [x, 1] design matrix used by the fit above,
// computed in closed form from X^T X's eigenvalues (a 2x2 symmetric matrix
// has a direct quadratic-formula eigen-solution, no iterative solver
// needed). A high condition number means the fit is numerically fragile --
// the same underlying concern a convex-hull spread check or a collinearity
// test each approximate geometrically, but this measures it directly for
// the regression actually being solved, on a continuous scale rather than
// two separate pass/fail heuristics.
function designMatrixConditionNumber(xs) {
  const n = xs.length;
  const sx = xs.reduce((s, v) => s + v, 0);
  const sxx = xs.reduce((s, v) => s + v * v, 0);
  // X^T X = [[sxx, sx], [sx, n]]
  const trace = sxx + n, det = sxx * n - sx * sx;
  const disc = Math.sqrt(Math.max(0, trace * trace - 4 * det));
  const l1 = (trace + disc) / 2, l2 = (trace - disc) / 2;
  if (l2 <= 1e-12) return Infinity;   // singular or numerically indistinguishable from it
  return Math.sqrt(l1 / l2);
}

// Leave-one-out cross-validation: refit on every point but one, predict the
// held-out point, repeat for each point. Reports RMSE over those N genuinely
// held-out predictions -- the standard, unbiased way to ask "how well does
// this curve generalise" rather than just reporting fit error on the same
// points that trained it.
function powerLawLOOCV(usable) {
  if (usable.length < 3) return null;   // need >=2 points left after holding one out
  let sqSum = 0, nOk = 0;
  for (let i = 0; i < usable.length; i++) {
    const rest = usable.slice(0, i).concat(usable.slice(i + 1));
    const fit = fitPowerLaw(rest);
    if (!fit) continue;
    const held = usable[i];
    const predicted = fit.a * Math.pow(held.measured, fit.b);
    sqSum += (predicted - held.known) ** 2;
    nOk++;
  }
  if (nOk === 0) return null;
  return { rmse: Math.sqrt(sqSum / nOk), n: nOk };
}

// Bootstrap confidence interval on the fitted exponent b: resample the
// control points WITH replacement many times, refit each resample, and
// take the 5th/95th percentile of the resulting b values. This answers a
// different, harder question than LOOCV's prediction error -- "how much
// would the fitted CURVE SHAPE itself change if slightly different points
// had been clicked" -- which a single point estimate plus a cross-
// validation score never reports at all.
function powerLawBootstrapCI(usable, resamples) {
  if (usable.length < 3) return null;
  const n = usable.length;
  const bs = [];
  // Deterministic PRNG (mulberry32), not Math.random(): a control-point
  // configuration's reported confidence interval must reproduce identically
  // on a re-click of "recompute," or the number itself becomes something to
  // distrust.
  let seed = 0x2f6e2b1;
  const rnd = () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  for (let r = 0; r < resamples; r++) {
    const sample = [];
    for (let i = 0; i < n; i++) sample.push(usable[Math.floor(rnd() * n)]);
    const fit = fitPowerLaw(sample);
    if (fit) bs.push(fit.b);
  }
  if (bs.length < resamples * 0.5) return null;   // too many degenerate resamples to trust
  bs.sort((x, y) => x - y);
  const pct = (p) => bs[Math.min(bs.length - 1, Math.floor(p * bs.length))];
  return { lo: pct(0.05), hi: pct(0.95), n: bs.length };
}

function fitPowerLawDiagnostics(usable, flatOut) {
  if (usable.length < 2) return null;
  const fit = fitPowerLaw(usable);
  if (!fit) return null;
  const { a, b } = fit;
  const n = usable.length;
  const plOut = usable.map((p) => {
    const predicted = a * Math.pow(p.measured, b);
    return { ...p, predicted, residual: predicted - p.known };
  });
  const plMae = plOut.reduce((s, p) => s + Math.abs(p.residual), 0) / n;
  const flatMae = flatOut.reduce((s, p) => s + Math.abs(p.residual), 0) / flatOut.length;
  const xs = usable.map((p) => Math.log(p.measured));
  return {
    a, b, mae: plMae,
    improvementFrac: flatMae > 1e-9 ? (flatMae - plMae) / flatMae : 0,
    significant: Math.abs(b - 1.0) > 0.15,
    conditionNumber: designMatrixConditionNumber(xs),
    illConditioned: designMatrixConditionNumber(xs) > 30,   // Belsley et al.'s standard econometric threshold
    loocv: powerLawLOOCV(usable),
    bootstrapCI: powerLawBootstrapCI(usable, 500),
  };
}

function gcpSolve(points) {
  const usable = points.filter((p) => p.measured >= GCP_MIN_MEASURED && p.known > 0);
  if (usable.length < 2) {
    return { ok: false, reason: `need 2 usable points, have ${usable.length}` };
  }
  const med = (a) => {
    const s = [...a].sort((x, y) => x - y);
    const m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  };
  const factor = med(usable.map((p) => p.known)) / med(usable.map((p) => p.measured));
  const alt = med(usable.map((p) => p.known / p.measured));
  const out = usable.map((p) => {
    const predicted = p.measured * factor;
    const residual = predicted - p.known;
    const frac = Math.abs(residual) / Math.max(p.known, 1e-9);
    return { ...p, predicted, residual, frac, suspect: frac > GCP_SUSPECT_FRAC };
  });
  const disagreement = Math.abs(factor - alt) / Math.max(Math.abs(factor), 1e-9);

  // A flat ratio assumes the same proportional error at every height, which
  // is only true if error is genuinely scale-invariant. It usually isn't --
  // a shed a metre off is a much bigger fraction of its own height than a
  // tower a metre off. Fitting known = a * measured^b in log space (b=1
  // would mean "flat ratio was already right") checks that assumption
  // against these actual points instead of assuming it, and surfaces
  // whether it matters HERE rather than only citing that it can matter in
  // general. This is reported alongside the flat factor, not swapped in for
  // it -- applying a per-vertex power-law correction to the actual geometry
  // is a materially larger, riskier change than this diagnostic, and isn't
  // attempted here.
  //
  // Rigor here is deliberately regression diagnostics (condition number,
  // leave-one-out cross-validation, a bootstrap confidence interval on the
  // fitted exponent), not geometric heuristics (a convex-hull spread check,
  // a separate collinearity test). Those two heuristics both exist to catch
  // "the points are badly arranged for this fit" -- a condition number
  // measures exactly that, directly, as a single continuous number, for
  // whatever is actually being fit, rather than two separate binary
  // pass/fail geometric proxies for it. The bootstrap CI goes further than
  // a point-estimate-plus-cross-validation-error: it reports UNCERTAINTY in
  // the curve's shape itself, not just how well it predicts held-out points.
  const powerLaw = fitPowerLawDiagnostics(usable, out);

  return {
    ok: true, factor, alt, disagreement,
    disagree: disagreement > 0.10,
    points: out,
    mae: out.reduce((s, p) => s + Math.abs(p.residual), 0) / out.length,
    nSuspect: out.filter((p) => p.suspect).length,
    powerLaw,
  };
}

// Rescale the scene about the terrain datum.
//
// About the GROUND MINIMUM, not the origin: scaling about y=0 would move the
// terrain itself, so a scene whose datum sits at 30 m would see its ground rise
// to 45 m at x1.5 and every building would float. Scaling about the datum keeps
// the ground where it is and stretches only what stands on it, which is what a
// height scale means.
function gcpApplyFactor(factor) {
  if (!groundMesh || !isFinite(factor) || factor <= 0) return false;
  const datum = new THREE.Box3().setFromObject(groundMesh).min.y;
  const rel = gcpApplied ? factor / gcpApplied : factor;

  scene.traverse((o) => {
    if (!o.isMesh || o === floodMeshObj) return;
    const pos = o.geometry && o.geometry.attributes && o.geometry.attributes.position;
    if (!pos) return;
    const arr = pos.array;
    for (let i = 1; i < arr.length; i += 3) {
      arr[i] = datum + (arr[i] - datum) * rel;
    }
    pos.needsUpdate = true;
    o.geometry.computeVertexNormals();
    o.geometry.computeBoundingSphere();
    o.geometry.computeBoundingBox();
  });

  // The records must move with the geometry, or the readout would report the
  // old height for a building that is now drawn at a new one.
  if (BUILDING_RECORDS) {
    for (const r of BUILDING_RECORDS) {
      const q = r.props;
      for (const k of ["height_m", "base_h", "roof_h"]) {
        if (typeof q[k] === "number") q[k] = q[k] * rel;
      }
      // The conformal band is a width in the scene's units. Rescaling the
      // heights without it would leave a band fitted at one size attached to
      // heights at another.
      if (typeof q.interval_half_width_m === "number") {
        q.interval_half_width_m = q.interval_half_width_m * rel;
      }
      q.height_is_metric = true;
    }
  }
  gcpApplied = factor;
  if (SCENE_META) {
    SCENE_META.height_is_metric = true;
    SCENE_META.tier = "A* (operator ground control -- asserted, not instrument-measured)";
    SCENE_META.gcp_factor = factor;
  }
  return true;
}

function gcpRender() {
  const el = document.getElementById("gcp-panel");
  if (!el) return;
  if (!gcpActive) { el.style.display = "none"; return; }
  el.style.display = "block";

  if (!gcpPoints.length) {
    el.innerHTML = '<div class="gcp-hint">Click a building, then type its real '
      + 'height in metres. Two or more points are needed.</div>';
    return;
  }

  const res = gcpSolve(gcpPoints);
  let html = "";
  for (let i = 0; i < gcpPoints.length; i++) {
    const p = gcpPoints[i];
    const r = res.ok ? res.points.find((q) => q.id === p.id) : null;
    const suspect = r && r.suspect;
    html += `<div class="gcp-row${suspect ? " suspect" : ""}">`
      + `<span class="gcp-m">${p.measured.toFixed(1)}</span>`
      + `<span class="gcp-arrow">&rarr;</span>`
      + `<span class="gcp-k">${p.known.toFixed(1)} m</span>`
      + (r ? `<span class="gcp-r">${r.residual >= 0 ? "+" : ""}${r.residual.toFixed(1)} m</span>` : "<span class='gcp-r'>-</span>")
      + `<button class="gcp-drop" data-i="${i}" title="Drop this point">&times;</button>`
      + "</div>";
  }
  if (res.ok) {
    html += `<div class="gcp-sum">scale &times;${res.factor.toFixed(4)} `
         + `&middot; residual MAE ${res.mae.toFixed(2)} m</div>`;
    if (res.disagree) {
      html += `<div class="gcp-warn">Control points disagree on one scale: `
           + `median-of-ratios would give &times;${res.alt.toFixed(4)} `
           + `(${Math.round(res.disagreement * 100)}% apart). Check the points `
           + `before applying.</div>`;
    }
    if (res.nSuspect) {
      html += `<div class="gcp-warn">${res.nSuspect} point(s) marked suspect — `
           + `a residual over ${Math.round(GCP_SUSPECT_FRAC * 100)}% is as likely `
           + `a mistyped height as a bad reconstruction.</div>`;
    }
    if (res.powerLaw && res.powerLaw.significant) {
      const pl = res.powerLaw;
      html += `<div class="gcp-warn">Error here isn't a flat ratio — a height^`
           + `${pl.b.toFixed(2)} curve fits ${Math.round(pl.improvementFrac * 100)}% `
           + `better than one flat scale on these points. The Apply button still uses the flat `
           + `scale (uniform to every vertex); this is a diagnostic, not yet a correction.</div>`;
      if (pl.bootstrapCI) {
        html += `<div class="gcp-hint">exponent 90% CI [${pl.bootstrapCI.lo.toFixed(2)}, `
             + `${pl.bootstrapCI.hi.toFixed(2)}] over ${pl.bootstrapCI.n} resamples`
             + (pl.bootstrapCI.lo <= 1.0 && pl.bootstrapCI.hi >= 1.0
                ? " — includes 1.0, so \"it's just a flat ratio\" isn't ruled out yet"
                : " — reliably excludes 1.0 (flat ratio), the curve is real")
             + `.</div>`;
      }
      if (pl.loocv) {
        html += `<div class="gcp-hint">leave-one-out cross-validation: `
             + `${pl.loocv.rmse.toFixed(2)} m RMSE on ${pl.loocv.n} held-out points `
             + `(fit-on-same-data MAE above is optimistic; this isn't).</div>`;
      }
      if (pl.illConditioned) {
        html += `<div class="gcp-warn">Condition number ${pl.conditionNumber.toFixed(0)} — `
             + `these points' heights are too similar/too few to trust the curve shape `
             + `(threshold 30, standard for this kind of regression). Add a point at a `
             + `different height before relying on this.</div>`;
      }
    }
    html += `<button class="gcp-apply" id="gcp-apply">Apply scale &rarr; metric</button>`;
  } else {
    html += `<div class="gcp-hint">${res.reason}</div>`;
  }
  el.innerHTML = html;

  el.querySelectorAll(".gcp-drop").forEach((b) => {
    b.addEventListener("click", (e) => {
      e.stopPropagation();
      const i = parseInt(b.dataset.i, 10);
      if (gcpPoints[i] && gcpPoints[i].marker) scene.remove(gcpPoints[i].marker);
      gcpPoints.splice(i, 1);
      gcpRender();
    });
  });
  const ap = document.getElementById("gcp-apply");
  if (ap) {
    ap.addEventListener("click", () => {
      const r = gcpSolve(gcpPoints);
      if (!r.ok) return;
      if (gcpApplyFactor(r.factor)) {
        document.getElementById("measure-panel").textContent =
          `Scene scaled from ${r.points.length} ground control points `
          + `(x${r.factor.toFixed(4)}, residual MAE ${r.mae.toFixed(2)} m).\n`
          + `Tier A* — heights are now metric, on the operator's authority `
          + `rather than an instrument's.`;
        gcpRender();
      }
    });
  }
}

function gcpAddPoint(worldPoint, measuredHeight) {
  const raw = window.prompt(
    `This building measures ${measuredHeight.toFixed(1)} `
    + `${(SCENE_META && SCENE_META.height_is_metric) ? "m" : "units"}.\n`
    + "What is its real height in metres?");
  if (raw === null) return;
  const known = parseFloat(raw);
  if (!isFinite(known) || known <= 0) return;

  const marker = new THREE.Mesh(
    new THREE.SphereGeometry(Math.max(1.0, camera.position.distanceTo(worldPoint) * 0.004), 12, 12),
    new THREE.MeshBasicMaterial({ color: 0xffc94d }));
  marker.position.copy(worldPoint);
  marker.renderOrder = 4;
  scene.add(marker);

  gcpPoints.push({
    id: gcpPoints.length + 1, measured: measuredHeight, known: known,
    x: worldPoint.x, z: worldPoint.z, marker,
  });
  gcpRender();
}

function setGcpMode(on) {
  gcpActive = on === undefined ? !gcpActive : on;
  const b = document.getElementById("btn-gcp");
  if (b) b.classList.toggle("active", gcpActive);
  if (gcpActive) {
    measureActive = false;
    document.getElementById("btn-measure").classList.remove("active");
    if (typeof setToolMode === "function") { toolMode = null; }
    document.getElementById("measure-panel").textContent =
      "Ground control: click a building whose real height you know.";
  }
  gcpRender();
}


// --- Conformal interval as geometry -----------------------------------------
//
// The interval already exists per building, in the readout, as a number nobody
// reads until they click. Drawn as a cap spanning roof-q to roof+q it becomes
// the first thing visible about the scene: a confident building wears a thin
// sliver, an uncertain one a thick slab, and the eye sorts them without being
// told what the number means.
//
// Unlit, like the confidence overlay and for the same reason. A lit band would
// be bright on one side and dark on the other, so its apparent thickness -- the
// only thing it encodes -- would depend on where the sun happens to be.
//
// Tier C scenes get no bands at all. The interval is a claim in metres, and a
// relative-scale scene has none; drawing a band there would put a metric
// uncertainty on a height that was never measured.
let bandGroup = null;
let bandsOn = false;

function buildBands() {
  if (bandGroup) return bandGroup;
  if (!BUILDING_RECORDS || !SCENE_META || !groundMesh) return null;
  if (!SCENE_META.height_is_metric) return null;

  const ox = SCENE_META.origin_x || 0, oy = SCENE_META.origin_y || 0;
  const datum = new THREE.Box3().setFromObject(groundMesh).min.y;
  bandGroup = new THREE.Group();
  bandGroup.name = "conformal-bands";

  let made = 0;
  for (const rec of BUILDING_RECORDS) {
    const q = rec.props;
    const hw = q.interval_half_width_m;
    const h = q.height_m;
    if (typeof hw !== "number" || typeof h !== "number" || !rec.ring.length) continue;

    // Footprint into scene coordinates, same convention as everything else:
    // x runs east from the origin, z IS (cy - origin_y).
    // The shape is built in XY and then rotated -90 deg about X, which maps a
    // shape point (x, y) to scene (x, 0, -y). Scene z must come out as
    // (cy - origin_y), so the shape's y has to be its NEGATION -- feeding
    // (cy - origin_y) straight in mirrors every footprint to the far side of
    // the origin, which put the whole band layer in the sky beside the city.
    const pts = [];
    for (const pt of rec.ring) {
      pts.push(new THREE.Vector2(pt[0] - ox, -(pt[1] - oy)));
    }
    if (pts.length < 3) continue;

    let shape;
    try { shape = new THREE.Shape(pts); } catch (e) { continue; }
    const geo = new THREE.ExtrudeGeometry(shape, { depth: 2 * hw, bevelEnabled: false });
    // Shape lies in XY and extrudes along +Z; rotate so it extrudes vertically.
    geo.rotateX(-Math.PI / 2);

    // The ground beneath this footprint, so the cap sits at the roof rather
    // than at a scene-wide datum -- a building on a rise would otherwise wear
    // its band buried in the hillside.
    const gy = sampleGroundAt(rec.cx - ox, rec.cy - oy, datum);
    const roofY = gy + h;

    const mesh = new THREE.Mesh(geo, bandMaterial(hw, h));
    mesh.position.y = roofY - hw;
    mesh.renderOrder = 3;
    bandGroup.add(mesh);
    made++;
  }
  bandGroup.visible = false;
  scene.add(bandGroup);
  bandGroup.userData.count = made;
  return bandGroup;
}

// Colour by RELATIVE uncertainty, not absolute. A +/-4.5 m band on a 90 m tower
// is tight; the same band on a 6 m house is the whole building. Shading by the
// raw half-width would paint every building the same, since the fitted quantile
// is constant across the scene, and encode nothing.
function bandMaterial(hw, h) {
  const rel = Math.min(1, (hw / Math.max(h, 1e-6)) / 0.6);
  const col = new THREE.Color().setHSL(
    0.33 * (1 - rel),          // green -> amber -> red
    0.75,
    0.5);
  return new THREE.MeshBasicMaterial({
    color: col, transparent: true,
    opacity: 0.22 + 0.28 * rel,
    depthWrite: false, side: THREE.DoubleSide,
  });
}

function sampleGroundAt(x, z, fallback) {
  const g = (typeof floodBuildGrid === "function") ? floodBuildGrid() : null;
  if (!g) return fallback;
  const c = Math.round((x - g.x0) / (g.dx || 1));
  const r = Math.round((z - g.z0) / (g.dz || 1));
  if (r < 0 || r >= g.h || c < 0 || c >= g.w) return fallback;
  return g.y[r * g.w + c];
}

function setBands(on) {
  bandsOn = on === undefined ? !bandsOn : on;
  const btn = document.getElementById("btn-bands");
  const grp = buildBands();
  if (!grp) {
    if (btn) btn.classList.remove("active");
    bandsOn = false;
    document.getElementById("measure-panel").textContent =
      (SCENE_META && !SCENE_META.height_is_metric)
        ? "No uncertainty bands: this scene's heights are on a relative scale, "
          + "so there is no metre interval to draw."
        : "No uncertainty bands: no conformal interval is attached to these "
          + "buildings (run scripts/fit_conformal.py and rebuild).";
    return;
  }
  grp.visible = bandsOn;
  if (btn) btn.classList.toggle("active", bandsOn);
  if (bandsOn) {
    document.getElementById("measure-panel").textContent =
      `Uncertainty bands on ${grp.userData.count} buildings. Each cap spans the `
      + `90% conformal interval, so its thickness is how far the true roof could `
      + `be from the one drawn. Colour is the band as a FRACTION of the `
      + `building's height: green where the interval is tight relative to the `
      + `structure, red where it is most of it.`;
  }
}


// --- Damage overlay ---------------------------------------------------------
//
// A raster change map answers "where did the surface move". A responder needs a
// list of structures with a verdict against each, and needs to see it on the
// model rather than in a spreadsheet.
//
// Every verdict here was gated on the conformal interval before it was written.
// INCONCLUSIVE is drawn in its own colour rather than folded into intact,
// because "undamaged" and "our instrument cannot tell you" send a responder to
// different places, and collapsing the second into the first is how a survey
// quietly under-reports a disaster.
let damageData = null;
let damageGroup = null;
let damageOn = false;

const DAMAGE_STYLE = {
  COLLAPSED:    { color: 0xc4342b, rank: 0, label: "Collapsed" },
  PARTIAL:      { color: 0xd98a2b, rank: 1, label: "Partial" },
  INCONCLUSIVE: { color: 0x8f7fb0, rank: 2, label: "Inconclusive" },
  INTACT:       { color: 0x3f8f5c, rank: 3, label: "Intact" },
  GREW:         { color: 0x3d7fa8, rank: 4, label: "Grew" },
};

async function loadDamage() {
  if (damageData !== null) return damageData;
  try {
    const r = await fetch(`${BASE}/damage.viewer.json`, { cache: "no-store" });
    damageData = r.ok ? await r.json() : false;
  } catch (e) { damageData = false; }
  return damageData;
}

function buildDamage() {
  if (damageGroup || !damageData || !BUILDING_RECORDS || !SCENE_META) return damageGroup;
  const ox = SCENE_META.origin_x || 0, oy = SCENE_META.origin_y || 0;
  const datum = new THREE.Box3().setFromObject(groundMesh).min.y;
  damageGroup = new THREE.Group();
  damageGroup.name = "damage";

  // Index the scene's buildings by centroid so each verdict lands on the prism
  // it describes. The records' rings are needed for the shell, so a verdict
  // with no matching record is skipped rather than drawn at a guessed place.
  for (const d of damageData.buildings) {
    let best = null, bestD = Infinity;
    for (const rec of BUILDING_RECORDS) {
      const dx = rec.cx - d.cx, dy = rec.cy - d.cy;
      const dd = dx * dx + dy * dy;
      if (dd < bestD) { bestD = dd; best = rec; }
    }
    if (!best || bestD > 25 * 25 || !best.ring.length) continue;

    const style = DAMAGE_STYLE[d.class] || DAMAGE_STYLE.INCONCLUSIVE;
    const pts = [];
    for (const pt of best.ring) pts.push(new THREE.Vector2(pt[0] - ox, -(pt[1] - oy)));
    if (pts.length < 3) continue;
    let shape;
    try { shape = new THREE.Shape(pts); } catch (e) { continue; }

    // Full height, base to roof: the verdict is about the structure, not its
    // roofline, so the whole prism carries the colour.
    const h = Math.max(1.0, best.props.height_m || 1.0);
    const geo = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false });
    geo.rotateX(-Math.PI / 2);
    const gy = sampleGroundAt(best.cx - ox, best.cy - oy, datum);
    const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color: style.color, transparent: true, opacity: 0.55,
      depthWrite: false, side: THREE.DoubleSide,
    }));
    mesh.position.y = gy;
    mesh.renderOrder = 3;
    mesh.userData.damage = d;
    damageGroup.add(mesh);
  }
  damageGroup.visible = false;
  scene.add(damageGroup);
  return damageGroup;
}

function damagePanelHtml() {
  if (!damageData) return "";
  const c = damageData.counts || {};
  let html = '<div class="dmg-head">Damage assessment</div>';
  if (damageData.source_note) {
    html += `<div class="dmg-sim">${damageData.source_note}</div>`;
  }
  html += `<div class="dmg-gate">Gate: &plusmn;${damageData.half_width_m} m per height, `
       + `so &plusmn;${damageData.difference_band_m} m on the difference. `
       + `A change inside that band is not evidence.</div>`;
  html += '<div class="dmg-counts">';
  for (const k of ["COLLAPSED", "PARTIAL", "INCONCLUSIVE", "INTACT", "GREW"]) {
    if (!c[k]) continue;
    const st = DAMAGE_STYLE[k];
    html += `<div class="dmg-c"><span class="dmg-sw" style="background:#`
         + st.color.toString(16).padStart(6, "0") + `"></span>`
         + `${st.label}<b>${c[k]}</b></div>`;
  }
  html += "</div>";

  // Ranked: most damaged first, which is the order a responder reads.
  const ranked = [...damageData.buildings].sort((a, b) => {
    const ra = DAMAGE_STYLE[a.class] ? DAMAGE_STYLE[a.class].rank : 9;
    const rb = DAMAGE_STYLE[b.class] ? DAMAGE_STYLE[b.class].rank : 9;
    return ra - rb || a.delta_m - b.delta_m;
  }).slice(0, 12);
  html += '<div class="dmg-list">';
  for (const d of ranked) {
    const st = DAMAGE_STYLE[d.class] || DAMAGE_STYLE.INCONCLUSIVE;
    html += `<div class="dmg-row"><span class="dmg-sw" style="background:#`
         + st.color.toString(16).padStart(6, "0") + `"></span>`
         + `<span class="dmg-h">${d.before_h_m.toFixed(0)}&rarr;${d.after_h_m.toFixed(0)} m</span>`
         + `<span class="dmg-d">${d.delta_m >= 0 ? "+" : ""}${d.delta_m.toFixed(1)}</span></div>`;
  }
  html += "</div>";
  if (damageData.buildings.length > 12) {
    html += `<div class="dmg-gate">${damageData.buildings.length - 12} more in the CSV export.</div>`;
  }
  return html;
}

async function setDamage(on) {
  const d = await loadDamage();
  const panel = document.getElementById("dmg-panel");
  const btn = document.getElementById("btn-damage");
  if (!d) {
    if (btn) btn.classList.remove("active");
    if (panel) panel.style.display = "none";
    document.getElementById("measure-panel").textContent =
      "No damage assessment for this scene. Run:\n"
      + "  python damage.py before/buildings.geojson after/buildings.geojson\n"
      + "and copy damage.viewer.json into the scene folder.";
    return;
  }
  damageOn = on === undefined ? !damageOn : on;
  const grp = buildDamage();
  if (grp) grp.visible = damageOn;
  if (btn) btn.classList.toggle("active", damageOn);
  if (panel) {
    panel.style.display = damageOn ? "block" : "none";
    if (damageOn) panel.innerHTML = damagePanelHtml();
  }
}

// --- Cinematic flythrough ---------------------------------------------------
//
// Waypoints come from the scene's own tallest buildings rather than a hand-set
// path, so the tour adapts to whatever tile is loaded instead of being authored
// for one. A demo that has to be re-choreographed per scene does not survive
// contact with a live audience.
//
// Motion uses a Catmull-Rom spline through the waypoints with eased time, for
// two reasons: linear interpolation between waypoints produces a visible
// direction snap at every one, and constant-speed motion through a turn reads
// as mechanical. The camera also always looks at the scene centre, so the
// subject stays framed while the viewpoint travels.
let tourActive = false;
let tourT = 0;
let tourCurve = null;
let tourCentre = null;

function buildTour() {
  if (!groundMesh) return null;
  const box = new THREE.Box3().setFromObject(groundMesh);
  const c = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const r = Math.max(size.x, size.z);
  tourCentre = c;

  // An orbit that also rises and falls, so the tour shows the skyline in
  // profile at its low points and the street layout from above at its high
  // ones -- a flat orbit shows one of those and never the other.
  const pts = [];
  const N = 8;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2;
    const lift = 0.28 + 0.22 * Math.sin(a * 2);
    const dist = r * (0.62 + 0.10 * Math.cos(a * 3));
    pts.push(new THREE.Vector3(
      c.x + Math.cos(a) * dist,
      c.y + size.y + r * lift,
      c.z + Math.sin(a) * dist));
  }
  return new THREE.CatmullRomCurve3(pts, true, "catmullrom", 0.5);
}

function updateTour(dt) {
  if (!tourActive || !tourCurve) return;
  // 60 seconds for a full circuit: slow enough to read the city, short enough
  // to sit through.
  tourT = (tourT + dt / 60.0) % 1.0;
  const p = tourCurve.getPointAt(tourT);
  camera.position.copy(p);
  controls.target.lerp(tourCentre, 0.1);
  controls.update();
}


// --- Analysis tools ---------------------------------------------------------
//
// Five tools sharing one principle: they read the geometry already on screen
// rather than a second copy of the data. A flood level compared against a
// separately loaded height raster could disagree with what the viewer draws;
// raycasting the actual mesh cannot.

const CAPTURE_HOUR = 10.5;   // typical sun-synchronous overpass, local solar

function analysisTargets() {
  const t = [];
  scene.traverse(function (o) {
    if (o.isMesh && o.visible && o !== floodMeshObj) t.push(o);
  });
  return t;
}

function heightUnit() {
  return (SCENE_META && SCENE_META.height_is_metric) ? "m" : "units";
}

// --- Inundation by flood fill on the terrain that is drawn ------------------
//
// The previous version was a horizontal plane at an elevation. A plane marks
// every cell below the water line as flooded, including ground the water cannot
// physically reach: a basin behind a ridge, a depression with no channel to the
// river, the inside of an embanked compound. Measured on a synthetic case in
// flood.py's test, a plane floods 2000 cells where a fill from the channel
// floods 1200 -- 800 cells of dry ground reported underwater.
//
// So water starts from a SEED the operator places and spreads only to terrain
// both below the level and connected to the seed through terrain also below it.
//
// The grid comes from the ground mesh's own vertices rather than a second copy
// of the DTM. build_ground_mesh emits one vertex per cell, row-major, Y-up with
// -Z south; reading it means the flood is computed on exactly the surface being
// rendered, so the waterline cannot disagree with the terrain under it.
let floodGrid = null;      // {w, h, y: Float32Array, x0, z0, dx, dz}
let floodSeed = null;      // {r, c} in grid coordinates
let floodWet = null;       // Uint8Array mask
let floodMeshObj = null;

function floodBuildGrid() {
  if (floodGrid || !groundMesh) return floodGrid;
  const pos = groundMesh.geometry.attributes.position;
  const n = pos.count;
  // The grid is square in the pipeline (GROUND_GRID x GROUND_GRID); recover the
  // side rather than assuming a constant, so a differently sized build works.
  const side = Math.round(Math.sqrt(n));
  if (side * side !== n) return null;

  const y = new Float32Array(n);
  for (let i = 0; i < n; i++) y[i] = pos.getY(i);
  const x0 = pos.getX(0), z0 = pos.getZ(0);
  const dx = pos.getX(1) - x0;                 // step along a row
  const dz = pos.getZ(side) - z0;              // step between rows
  floodGrid = { w: side, h: side, y, x0, z0, dx, dz };
  return floodGrid;
}

function floodWorldToCell(p) {
  const g = floodBuildGrid();
  if (!g) return null;
  const c = Math.round((p.x - g.x0) / (g.dx || 1));
  const r = Math.round((p.z - g.z0) / (g.dz || 1));
  if (r < 0 || r >= g.h || c < 0 || c >= g.w) return null;
  return { r, c };
}

// Breadth-first fill. 4-connected, not 8: a diagonal touch between two cells is
// not a channel water flows through, and 8-connectivity leaks a flood across a
// one-cell-wide diagonal ridge.
function floodFill(levelY) {
  const g = floodBuildGrid();
  if (!g || !floodSeed) return null;
  const { w, h, y } = g;
  const seedIdx = floodSeed.r * w + floodSeed.c;
  if (!(y[seedIdx] <= levelY)) {
    return { dry: true, seedY: y[seedIdx], cells: 0 };
  }
  const wet = new Uint8Array(w * h);
  const queue = new Int32Array(w * h);
  let head = 0, tail = 0;
  queue[tail++] = seedIdx;
  wet[seedIdx] = 1;
  let cells = 0, depthSum = 0, depthMax = 0;

  while (head < tail) {
    const i = queue[head++];
    cells++;
    const d = levelY - y[i];
    depthSum += d;
    if (d > depthMax) depthMax = d;
    const r = (i / w) | 0, c = i - r * w;
    if (c > 0)     { const j = i - 1; if (!wet[j] && y[j] <= levelY) { wet[j] = 1; queue[tail++] = j; } }
    if (c < w - 1) { const j = i + 1; if (!wet[j] && y[j] <= levelY) { wet[j] = 1; queue[tail++] = j; } }
    if (r > 0)     { const j = i - w; if (!wet[j] && y[j] <= levelY) { wet[j] = 1; queue[tail++] = j; } }
    if (r < h - 1) { const j = i + w; if (!wet[j] && y[j] <= levelY) { wet[j] = 1; queue[tail++] = j; } }
  }
  floodWet = wet;

  // What a plane would have claimed, for the comparison the readout makes.
  let planeCells = 0;
  for (let i = 0; i < y.length; i++) if (y[i] <= levelY) planeCells++;

  const cellArea = Math.abs(g.dx * g.dz);
  return {
    dry: false, cells, planeCells, unreachable: planeCells - cells,
    areaM2: cells * cellArea,
    volumeM3: depthSum * cellArea,
    meanDepth: cells ? depthSum / cells : 0,
    maxDepth: depthMax,
  };
}

// The water surface is built from the wet cells only, so its edge follows the
// shoreline the fill found rather than a rectangle clipped by the scene bounds.
function floodBuildMesh(levelY) {
  const g = floodBuildGrid();
  if (floodMeshObj) { scene.remove(floodMeshObj); floodMeshObj.geometry.dispose(); floodMeshObj = null; }
  if (!g || !floodWet) return;
  const { w, h, x0, z0, dx, dz } = g;
  const verts = [], idx = [];
  const map = new Int32Array(w * h).fill(-1);
  for (let i = 0; i < w * h; i++) {
    if (!floodWet[i]) continue;
    const r = (i / w) | 0, c = i - r * w;
    map[i] = verts.length / 3;
    verts.push(x0 + c * dx, levelY, z0 + r * dz);
  }
  for (let r = 0; r < h - 1; r++) {
    for (let c = 0; c < w - 1; c++) {
      const a = map[r * w + c], b = map[r * w + c + 1];
      const d = map[(r + 1) * w + c], e = map[(r + 1) * w + c + 1];
      if (a < 0 || b < 0 || d < 0 || e < 0) continue;
      idx.push(a, d, b, b, d, e);
    }
  }
  if (!idx.length) return;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  floodMeshObj = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: 0x1c5f86, transparent: true, opacity: 0.62,
    roughness: 0.06, metalness: 0.25, depthWrite: false,
  }));
  floodMeshObj.renderOrder = 2;
  floodMeshObj.name = "floodwater";
  scene.add(floodMeshObj);
}

function floodBuildingsAffected() {
  const g = floodBuildGrid();
  if (!g || !floodWet || !BUILDING_RECORDS || !SCENE_META) return 0;
  let n = 0;
  for (const rec of BUILDING_RECORDS) {
    const x = (rec.cx - (SCENE_META.origin_x || 0));
    // Same convention as the evidence lookup above: scene z IS (cy - origin_y).
    const z = (rec.cy - (SCENE_META.origin_y || 0));
    const c = Math.round((x - g.x0) / (g.dx || 1));
    const r = Math.round((z - g.z0) / (g.dz || 1));
    if (r < 0 || r >= g.h || c < 0 || c >= g.w) continue;
    if (floodWet[r * g.w + c]) n++;
  }
  return n;
}

function floodUpdate(rise) {
  const el = document.getElementById("flood-readout");
  if (!groundMesh) return;
  const g = floodBuildGrid();
  if (!g) { if (el) el.textContent = "Terrain grid unavailable."; return; }

  if (rise <= 0.01) {
    if (floodMeshObj) { scene.remove(floodMeshObj); floodMeshObj = null; }
    floodWet = null;
    if (el) el.textContent = floodSeed
      ? "Water off"
      : "Water off — click the terrain in Flood mode to place the source.";
    return;
  }
  if (!floodSeed) {
    if (el) el.textContent = "Place a water source first: click Flood, then "
      + "click the terrain where the water comes from.";
    return;
  }

  const datum = new THREE.Box3().setFromObject(groundMesh).min.y;
  const levelY = datum + rise;
  const res = floodFill(levelY);
  if (!res) return;

  if (res.dry) {
    if (floodMeshObj) { scene.remove(floodMeshObj); floodMeshObj = null; }
    if (el) el.textContent = `Source sits ${(res.seedY - datum).toFixed(1)} above `
      + `the low point, higher than the ${rise.toFixed(1)} water level — `
      + `nothing floods. Lower the source or raise the level.`;
    return;
  }

  floodBuildMesh(levelY);
  const nb = floodBuildingsAffected();
  const metric = SCENE_META && SCENE_META.height_is_metric;

  if (!el) return;
  if (!metric) {
    // Tier C: the cell counts are real, the metres are not.
    el.textContent = `${res.cells.toLocaleString()} terrain cells inundated, `
      + `${nb} buildings affected — relative scale, so no area, depth or `
      + `volume in metres is reported.`;
  } else {
    let t = `${Math.round(res.areaM2).toLocaleString()} m² inundated · `
      + `${nb} buildings · ${Math.round(res.volumeM3).toLocaleString()} m³ · `
      + `mean depth ${res.meanDepth.toFixed(1)} m, max ${res.maxDepth.toFixed(1)} m`;
    if (res.unreachable > 0) {
      t += `\n${res.unreachable.toLocaleString()} cells sit below the water line `
        + `but are not connected to the source — a flat water plane would have `
        + `flooded them.`;
    }
    el.textContent = t;
  }
}

function setFloodSeedFromPoint(p) {
  const cell = floodWorldToCell(p);
  if (!cell) return false;
  floodSeed = cell;
  const slider = document.getElementById("flood");
  floodUpdate(parseFloat(slider ? slider.value : 0) || 0);
  return true;
}

// ---- LINE OF SIGHT ---------------------------------------------------------
//
// Marches between two picked points and asks at each step whether the scene
// surface rises above the straight line joining them. Sampling casts a ray
// DOWNWARD onto the scene rather than reading a height raster, so the answer
// matches the geometry actually rendered, buildings included - a bare terrain
// raster would miss those entirely.
let losLine = null;

function clearLineOfSight() {
  if (losLine) { scene.remove(losLine); losLine = null; }
}

function runLineOfSight(a, b) {
  clearLineOfSight();
  const STEPS = 200;
  const EYE = 1.7;                     // eye height of an observer, not feet
  const down = new THREE.Raycaster();
  down.far = 4000;
  const dir = new THREE.Vector3(0, -1, 0);
  const targets = analysisTargets();

  let blockedAt = null, blockedBy = null;
  const pts = [], cols = [];

  for (let i = 0; i <= STEPS; i++) {
    const t = i / STEPS;
    const p = new THREE.Vector3().lerpVectors(a, b, t);
    p.y += EYE;
    down.set(new THREE.Vector3(p.x, p.y + 900, p.z), dir);
    const h = down.intersectObjects(targets, false);
    const surf = h.length ? h[0].point.y : null;
    const clear = (surf === null) || (surf <= p.y + 0.25);
    if (!clear && blockedAt === null) {
      blockedAt = t;
      blockedBy = h.length ? ((h[0].object.userData && h[0].object.userData.isBuilding) ? "a building" : "terrain") : "terrain";
    }
    pts.push(p.x, p.y, p.z);
    if (blockedAt === null) cols.push(0.30, 0.85, 0.45);
    else cols.push(0.90, 0.28, 0.22);
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
  g.setAttribute("color", new THREE.Float32BufferAttribute(cols, 3));
  losLine = new THREE.Line(g, new THREE.LineBasicMaterial({ vertexColors: true }));
  losLine.renderOrder = 3;
  scene.add(losLine);

  const dist = a.distanceTo(b);
  const panel = document.getElementById("measure-panel");
  if (!panel) return;
  panel.textContent = (blockedAt === null)
    ? "Line of sight CLEAR over " + dist.toFixed(0) + " " + heightUnit() + "."
    : "Line of sight BLOCKED at " + (blockedAt * dist).toFixed(0) + " "
      + heightUnit() + " of " + dist.toFixed(0) + " ("
      + (blockedAt * 100).toFixed(0) + "% along), by " + blockedBy + ".";
}

// ---- ELEVATION CROSS-SECTION -----------------------------------------------
//
// Samples the rendered surface along a line and draws the profile. Buildings
// appear as sharp vertical steps because the sampling hits the roof, which is
// the point: a terrain-only profile would draw a smooth curve straight through
// a tower block.
function drawCrossSection(a, b) {
  const cv = document.getElementById("xsec");
  if (!cv) return;
  const N = 260;
  const down = new THREE.Raycaster();
  down.far = 4000;
  const dir = new THREE.Vector3(0, -1, 0);
  const targets = analysisTargets();

  const ys = [];
  for (let i = 0; i <= N; i++) {
    const p = new THREE.Vector3().lerpVectors(a, b, i / N);
    down.set(new THREE.Vector3(p.x, p.y + 900, p.z), dir);
    const h = down.intersectObjects(targets, false);
    ys.push(h.length ? h[0].point.y : null);
  }
  const valid = ys.filter(function (v) { return v !== null; });
  if (valid.length < 5) return;
  let lo = valid[0], hi = valid[0];
  for (const v of valid) { if (v < lo) lo = v; if (v > hi) hi = v; }
  const span = Math.max(hi - lo, 1);

  cv.style.display = "block";
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "rgba(12,16,20,0.90)";
  ctx.fillRect(0, 0, W, H);

  // A profile without a scale is a squiggle, so grid and end labels stay.
  ctx.strokeStyle = "rgba(255,255,255,0.12)";
  ctx.lineWidth = 1;
  for (let gi = 0; gi <= 4; gi++) {
    const y = 16 + (H - 32) * (gi / 4);
    ctx.beginPath(); ctx.moveTo(34, y); ctx.lineTo(W - 8, y); ctx.stroke();
  }
  ctx.fillStyle = "rgba(220,232,242,0.8)";
  ctx.font = "10px ui-monospace, monospace";
  ctx.fillText(hi.toFixed(0), 4, 20);
  ctx.fillText(lo.toFixed(0), 4, H - 16);

  ctx.beginPath();
  let started = false;
  for (let i = 0; i < ys.length; i++) {
    if (ys[i] === null) continue;
    const x = 34 + (W - 42) * (i / N);
    const y = 16 + (H - 32) * (1 - (ys[i] - lo) / span);
    if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = "#6ab6cd";
  ctx.lineWidth = 1.6;
  ctx.stroke();

  ctx.fillStyle = "rgba(220,232,242,0.8)";
  ctx.fillText(a.distanceTo(b).toFixed(0) + " " + heightUnit() + " section, relief "
               + span.toFixed(1), 38, H - 4);
}

function hideCrossSection() {
  const cv = document.getElementById("xsec");
  if (cv) cv.style.display = "none";
}

// ---- TIME-OF-DAY SUN -------------------------------------------------------
//
// Reuses the scene real solar geometry rather than spinning an arbitrary light.
// The capture own elevation and azimuth fix one point on the day arc; the
// slider walks that arc, so midday genuinely sits higher than morning and the
// azimuth sweeps the correct way.
//
// The satellite texture has the capture shadows baked into it and those cannot
// move, so this is a lighting study, not a claim about another time of day.
// The readout marks the hour that matches the capture.
function sunForHour(hour) {
  const noon = 12.0;
  const shape = function (h) { return Math.cos((h - noon) / 6.0 * (Math.PI / 2)); };
  const k = SUN_ELEVATION_DEG / Math.max(shape(CAPTURE_HOUR), 1e-3);
  const el = Math.max(3, Math.min(88, k * shape(hour)));
  const az = SUN_AZIMUTH_DEG + (hour - CAPTURE_HOUR) * 15.0;
  return { el: el, az: az };
}

function applySunHour(hour) {
  const s = sunForHour(hour);
  const d = sunDirectionFromAngles(s.el, s.az);
  if (groundMesh) {
    const box = new THREE.Box3().setFromObject(groundMesh);
    const c = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const span = Math.max(size.x, size.z);
    sunLight.position.copy(c).addScaledVector(d, span * 2);
    sunLight.target.position.copy(c);
    sunLight.target.updateMatrixWorld();
  }
  // Low sun is warmer and dimmer, as real low sun is.
  const t = Math.max(0, Math.min(1, s.el / 60));
  sunLight.intensity = 0.9 + 2.4 * t;
  sunLight.color.setRGB(1.0, 0.86 + 0.10 * t, 0.66 + 0.28 * t);

  const out = document.getElementById("sun-readout");
  if (!out) return;
  const hh = Math.floor(hour), mm = Math.round((hour - hh) * 60);
  const azn = ((Math.round(s.az) % 360) + 360) % 360;
  out.textContent = ("0" + hh).slice(-2) + ":" + ("0" + mm).slice(-2)
    + "   sun " + s.el.toFixed(0) + " deg elevation, " + azn + " deg azimuth"
    + (Math.abs(hour - CAPTURE_HOUR) < 0.3 ? "   (matches capture)" : "");
}


// --- Tool wiring ------------------------------------------------------------
//
// Line-of-sight and cross-section both want two picked points, and both want
// the picks to come from the same raycast the height tool already uses. They
// share one collector rather than each growing a private copy of it, so a
// change to how picking works cannot leave one tool behaving differently from
// the other.
let toolMode = null;                  // null | "los" | "xsec" | "area"
let toolPoints = [];
const toolMarkers = [];
let areaLine = null;                  // growing outline while an area pick is in progress

function clearToolPicks() {
  toolPoints = [];
  toolMarkers.forEach((m) => scene.remove(m));
  toolMarkers.length = 0;
  if (areaLine) { scene.remove(areaLine); areaLine.geometry.dispose(); areaLine = null; }
}

// Shoelace formula on the real ground plane (X/Z, ignoring Y so a building
// roof the polygon brushes past doesn't inflate the footprint) -- the
// standard, exact method for a simple polygon's area from its vertices, not
// an approximation. Scene units are already real metres when the scene is
// georeferenced/metric (SCENE_META.height_is_metric), so no separate scale
// factor is needed beyond what every other real-unit readout here already
// assumes.
function polygonAreaM2(points) {
  let sum = 0;
  for (let i = 0; i < points.length; i++) {
    const a = points[i], b = points[(i + 1) % points.length];
    sum += a.x * b.z - b.x * a.z;
  }
  return Math.abs(sum) / 2;
}

function finishAreaMeasurement() {
  const panel = document.getElementById("measure-panel");
  if (toolPoints.length < 3) {
    if (panel) panel.textContent = "Need at least 3 points for an area -- click more, or Measure Area again to cancel.";
    return;
  }
  const metric = SCENE_META && SCENE_META.height_is_metric;
  const areaM2 = polygonAreaM2(toolPoints);
  if (panel) {
    panel.textContent = metric
      ? `Area: ${areaM2 < 10000 ? areaM2.toFixed(0) + " m²" : (areaM2 / 10000).toFixed(2) + " ha"} `
        + `(${toolPoints.length} points)`
      : `Area: ${areaM2.toFixed(0)} sq. units (relative scale, ${toolPoints.length} points)`;
  }
}

function setToolMode(next) {
  const wasArea = toolMode === "area";
  const finishingArea = wasArea && next === "area" && toolPoints.length >= 3;
  toolMode = (toolMode === next) ? null : next;
  if (finishingArea) finishAreaMeasurement();
  if (toolMode !== "area") clearToolPicks();
  clearLineOfSight();
  hideCrossSection();
  document.getElementById("btn-los").classList.toggle("active", toolMode === "los");
  document.getElementById("btn-xsec").classList.toggle("active", toolMode === "xsec");
  const areaBtn = document.getElementById("btn-area");
  if (areaBtn) areaBtn.classList.toggle("active", toolMode === "area");
  if (toolMode) {
    // Turning a multi-point tool on cancels the one-point tool and pin
    // placement: leaving several armed at once would make a single click
    // mean more than one thing.
    measureActive = false;
    annotateActive = false;
    document.getElementById("btn-measure").classList.remove("active");
    const annBtn = document.getElementById("btn-annotate");
    if (annBtn) annBtn.classList.remove("active");
    document.getElementById("measure-panel").textContent =
      (toolMode === "los") ? "Click the observer position, then the target."
      : (toolMode === "xsec") ? "Click the two ends of the section line."
      : "Click each corner of the area, then press Measure Area again to close it.";
  } else if (!finishingArea) {
    document.getElementById("measure-panel").textContent =
      "Click a building to read its height.";
  }
}

function handleToolClick(event) {
  pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(scene.children, true)
    .filter((h) => h.object.isMesh && h.object.visible && h.object !== floodMeshObj);
  if (hits.length === 0) return;

  const p = hits[0].point.clone();
  toolPoints.push(p);

  const marker = new THREE.Mesh(
    new THREE.SphereGeometry(Math.max(0.8, camera.position.distanceTo(p) * 0.003), 12, 12),
    new THREE.MeshBasicMaterial({ color: toolMode === "los" ? 0x44dd77 : toolMode === "area" ? 0xe0c04a : 0x6ab6cd })
  );
  marker.position.copy(p);
  scene.add(marker);
  toolMarkers.push(marker);

  if (toolMode === "area") {
    // Redraw the outline (open polyline while picking -- closing it only
    // happens visually once finishAreaMeasurement is called, matching "the
    // shape isn't final until you say so").
    if (areaLine) { scene.remove(areaLine); areaLine.geometry.dispose(); areaLine = null; }
    if (toolPoints.length >= 2) {
      const g = new THREE.BufferGeometry().setFromPoints(toolPoints);
      areaLine = new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xe0c04a }));
      scene.add(areaLine);
    }
    document.getElementById("measure-panel").textContent =
      `${toolPoints.length} point(s) placed -- keep clicking, or press Measure Area again to close.`;
    return;
  }

  if (toolPoints.length < 2) {
    document.getElementById("measure-panel").textContent = "Now click the second point.";
    return;
  }
  const [a, b] = toolPoints;
  if (toolMode === "los") runLineOfSight(a, b);
  else drawCrossSection(a, b);
  // Keep the tool armed but drop the picks, so the next click starts a fresh
  // pair instead of silently extending the old one.
  toolPoints = [];
}

document.getElementById("btn-los").addEventListener("click", () => setToolMode("los"));
document.getElementById("btn-xsec").addEventListener("click", () => setToolMode("xsec"));
document.getElementById("btn-area").addEventListener("click", () => setToolMode("area"));
document.getElementById("btn-gcp").addEventListener("click", () => setGcpMode());
document.getElementById("btn-flood").addEventListener("click", () => {
  floodSeedMode = !floodSeedMode;
  document.getElementById("btn-flood").classList.toggle("active", floodSeedMode);
  if (floodSeedMode) {
    measureActive = false; gcpActive = false; toolMode = null;
    document.getElementById("btn-measure").classList.remove("active");
    document.getElementById("btn-gcp").classList.remove("active");
    document.getElementById("measure-panel").textContent =
      "Click the terrain where the water comes from — a river, a coast, a "
      + "breach. Water spreads only to ground connected to that point.";
  }
});
document.getElementById("btn-slope").addEventListener("click", () => setTextureMode("slope"));
document.getElementById("btn-bands").addEventListener("click", () => setBands());
document.getElementById("btn-damage").addEventListener("click", () => setDamage());
document.getElementById("btn-pdf").addEventListener("click", () => exportReport());
initXR();

// The flood slider is capped at the scene relief rather than a fixed 60: on a
// 12 m-relief tile a 60 m range spends most of its travel fully submerged.
document.getElementById("flood").addEventListener("input", (e) => {
  floodUpdate(parseFloat(e.target.value));
});
document.getElementById("sunhr").addEventListener("input", (e) => {
  applySunHour(parseFloat(e.target.value));
});

function calibrateFloodRange() {
  if (!groundMesh) return;
  const box = new THREE.Box3().setFromObject(groundMesh);
  const relief = Math.max(6, box.max.y - box.min.y);
  const el = document.getElementById("flood");
  el.max = (relief * 1.1).toFixed(1);
  el.step = (relief / 120).toFixed(2);
}


// --- Frame capture ----------------------------------------------------------
//
// The WebGPU canvas is not guaranteed to hold its contents after a frame ends,
// so a toDataURL issued from a button handler can come back blank. Capture is
// therefore queued and serviced inside the render loop, immediately after the
// draw, while the surface is still valid.
let _captureRequest = null;

function captureFrame() {
  return new Promise((resolve) => { _captureRequest = resolve; });
}

function servicePendingCapture() {
  if (!_captureRequest) return;
  const done = _captureRequest;
  _captureRequest = null;
  let url = null;
  try { url = renderer.domElement.toDataURL("image/png"); } catch (e) { url = null; }
  done(url);
}

// --- WebXR ------------------------------------------------------------------
//
// Feature-detected rather than assumed. WebXR needs both a browser that exposes
// navigator.xr and a renderer whose backend can drive an XR session; the WebGPU
// path does not have that on every build. The button is only shown when both
// are actually present, because a control that silently does nothing is worse
// than one that was never offered.
async function initXR() {
  const btn = document.getElementById("btn-xr");
  if (!btn) return;
  const supported = !!(navigator.xr && renderer.xr)
    && await navigator.xr.isSessionSupported("immersive-vr").catch(() => false);
  if (!supported) { btn.style.display = "none"; return; }

  renderer.xr.enabled = true;
  let session = null;
  btn.style.display = "";
  btn.textContent = "Enter VR";
  btn.addEventListener("click", async () => {
    if (session) { await session.end(); return; }
    try {
      session = await navigator.xr.requestSession("immersive-vr", {
        optionalFeatures: ["local-floor", "bounded-floor"]
      });
    } catch (e) {
      btn.textContent = "VR unavailable";
      return;
    }
    await renderer.xr.setSession(session);
    btn.textContent = "Exit VR";
    session.addEventListener("end", () => {
      session = null;
      btn.textContent = "Enter VR";
    });
  });
}

// --- PDF report -------------------------------------------------------------
//
// Printed from a generated document rather than assembled with a PDF library:
// the browser print pipeline already produces correct vector text, correct page
// breaks and a real PDF, and it adds nothing to the bundle. The viewer is
// offline-only and CSP-restricted, so pulling in a PDF library was not an
// option in any case.
//
// The report states what the scene is, how it was derived, and how far it can
// be trusted. Omitting the validation and confidence figures would turn a
// measurement into a picture.
function reportRows() {
  const m = SCENE_META || {};
  const rows = [];
  const push = (k, v) => { if (v !== undefined && v !== null && v !== "") rows.push([k, v]); };
  push("Tile", m.tile);
  push("View", m.view);
  push("Off-nadir", m.off_nadir_deg !== undefined ? m.off_nadir_deg + " deg" : null);
  push("Ground sample distance", m.gsd_m !== undefined ? m.gsd_m + " m/px" : null);
  push("Sun at capture", (m.sun_elevation_deg !== undefined)
    ? m.sun_elevation_deg + " deg elevation / " + m.sun_azimuth_deg + " deg azimuth" : null);
  push("Height calibration tier", m.tier);
  push("Buildings extruded", m.buildings_extruded);
  if (m.slope) {
    push("Terrain slope (median)", m.slope.median_deg + " deg");
    push("Terrain slope (95th pct)", m.slope.p95_deg + " deg");
    push("Ground classed steep (>15 deg)",
         (m.slope.frac_steep * 100).toFixed(1) + " %");
  }
  if (m.validation) {
    push("RMSE vs LiDAR", m.validation.rmse_m + " m");
    push("MAE vs LiDAR", m.validation.mae_m + " m");
    push("Bias vs LiDAR", m.validation.bias_m + " m");
    push("Reference extent", m.validation.covers_m + " m (central)");
  }
  return rows;
}

async function exportReport() {
  const btn = document.getElementById("btn-pdf");
  if (btn) btn.textContent = "Rendering...";
  const shot = await captureFrame();
  if (btn) btn.textContent = "Export PDF";

  const rows = reportRows();
  const w = window.open("", "_blank");
  if (!w) {
    document.getElementById("measure-panel").textContent =
      "The browser blocked the report window. Allow pop-ups for this page and try again.";
    return;
  }

  const doc = w.document;
  doc.title = "DepthWizard - " + ((SCENE_META && SCENE_META.tile) || "scene") + " report";

  const style = doc.createElement("style");
  style.textContent = [
    "@page { size: A4; margin: 18mm; }",
    "body { font: 11pt/1.5 Georgia, 'Times New Roman', serif; color: #14181c; }",
    "h1 { font-size: 20pt; margin: 0 0 2pt; letter-spacing: -0.01em; }",
    ".sub { font-size: 9.5pt; color: #55606a; margin-bottom: 16pt; }",
    "img { width: 100%; border: 1px solid #c8ced4; margin-bottom: 14pt; }",
    "table { border-collapse: collapse; width: 100%; font-size: 10pt; }",
    "th, td { text-align: left; padding: 5pt 8pt; border-bottom: 1px solid #dde2e6; }",
    "th { width: 45%; font-weight: normal; color: #55606a; }",
    "td { font-variant-numeric: tabular-nums; }",
    "p.note { font-size: 9pt; color: #55606a; margin-top: 14pt; }"
  ].join("\n");
  doc.head.appendChild(style);

  const h1 = doc.createElement("h1");
  h1.textContent = "Elevation report";
  doc.body.appendChild(h1);

  const sub = doc.createElement("div");
  sub.className = "sub";
  sub.textContent = ((SCENE_META && SCENE_META.tile) || "Scene") + "  -  generated "
    + new Date().toISOString().slice(0, 16).replace("T", " ") + " UTC";
  doc.body.appendChild(sub);

  if (shot) {
    const img = doc.createElement("img");
    img.src = shot;
    doc.body.appendChild(img);
  }

  const table = doc.createElement("table");
  for (const [k, v] of rows) {
    const tr = doc.createElement("tr");
    const th = doc.createElement("th");
    th.textContent = k;
    const td = doc.createElement("td");
    td.textContent = String(v);
    tr.appendChild(th); tr.appendChild(td);
    table.appendChild(tr);
  }
  doc.body.appendChild(table);

  const note = doc.createElement("p");
  note.className = "note";
  note.textContent = "Heights are derived from a single nadir view by plane-sweep "
    + "multi-view stereo; walls carry each building's own measured roof colour, "
    + "because nadir imagery contains no facade pixels to sample directly. Figures "
    + "above the reference extent line are measured against LiDAR ground truth; "
    + "outside it, no reference exists and accuracy is not established.";
  doc.body.appendChild(note);

  // Wait for the embedded frame to decode before printing, or the page prints
  // with an empty image box.
  const imgs = Array.from(doc.images);
  await Promise.all(imgs.map((im) => im.complete
    ? Promise.resolve()
    : new Promise((r) => { im.onload = r; im.onerror = r; })));
  w.focus();
  w.print();
}

// Expose the scene graph for external capture and debugging.
//
// The module scope is otherwise sealed, so nothing outside the page can frame a
// shot, switch texture mode or wait for the mesh to finish loading. Screenshots
// for documentation would otherwise have to be taken by hand, which is neither
// repeatable nor consistent between builds.
window.__dw = {
  get ready() { return groundMesh !== null; },
  scene, camera, controls, renderer,
  setTextureMode: (m) => setTextureMode(m),
  // Ground control, exposed for the parity test that checks this port still
  // agrees with calibration/gcp.py. Two implementations of one estimator will
  // drift apart silently otherwise, and the whole point of choosing
  // ratio-of-medians is lost if only one of them uses it.
  gcpSolve: (pts) => gcpSolve(pts),
  gcpApplyFactor: (f) => gcpApplyFactor(f),
  setGcpMode: (on) => setGcpMode(on),
  get gcpPoints() { return gcpPoints; },
  setBands: (on) => setBands(on),
  setDamage: (on) => setDamage(on),
  get damageGroup() { return damageGroup; },
  get damageData() { return damageData; },
  get bandGroup() { return bandGroup; },
  floodUpdate: (r) => floodUpdate(r),
  floodFill: (y) => floodFill(y),
  floodBuildGrid: () => floodBuildGrid(),
  setFloodSeedCell: (r, c) => { floodSeed = { r, c }; },
  get records() { return BUILDING_RECORDS; },
  get meta() { return SCENE_META; },
  // Presentation controls. The HUD is essential in the app and unwanted in a
  // still, and the fog that gives the live scene depth reads as a wash in a
  // single frame where the viewer cannot orbit to resolve it.
  setChrome(visible) {
    const ui = document.getElementById("ui");
    if (ui) ui.style.display = visible ? "block" : "none";
  },
  setFog(nearFactor, farFactor) {
    if (!scene.fog || !groundMesh) return;
    const box = new THREE.Box3().setFromObject(groundMesh);
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.z);
    scene.fog.near = maxDim * nearFactor;
    scene.fog.far = maxDim * farFactor;
  },
  frame(azimuthDeg, elevationDeg, distanceFactor) {
    if (!groundMesh) return false;
    const box = new THREE.Box3().setFromObject(groundMesh);
    const c = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const span = Math.max(size.x, size.z);
    const az = THREE.MathUtils.degToRad(azimuthDeg);
    const el = THREE.MathUtils.degToRad(elevationDeg);
    const d = span * (distanceFactor === undefined ? 1.1 : distanceFactor);
    camera.position.set(
      c.x + d * Math.cos(el) * Math.sin(az),
      c.y + d * Math.sin(el),
      c.z + d * Math.cos(el) * Math.cos(az));
    controls.target.copy(c);
    controls.update();
    return true;
  },
};

// --- Compass ---
//
// Bearing from the camera's look direction, not its position -- a compass
// reads "which way am I facing," and for an orbit-style camera those are
// different questions. North = -Z, east = +X, matching the convention this
// file already documents elsewhere (build_ground_mesh's row-major layout,
// "Scene Z runs south"). Verified by construction: forward (0,0,-1) [facing
// north] gives atan2(0, 1) = 0 deg; forward (1,0,0) [facing east] gives
// atan2(1, 0) = 90 deg.
const compassEl = document.createElement("div");
compassEl.id = "compass";
compassEl.style.cssText =
  "position:fixed;top:12px;right:12px;z-index:40;pointer-events:none;" +
  "background:rgba(10,14,20,0.7);color:#cde;border:1px solid #345;" +
  "border-radius:50%;width:46px;height:46px;display:flex;align-items:center;" +
  "justify-content:center;font:bold 13px monospace;";
document.body.appendChild(compassEl);
const CARDINALS = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
const _fwd = new THREE.Vector3();

function updateCompass() {
  camera.getWorldDirection(_fwd);
  _fwd.y = 0;
  if (_fwd.lengthSq() < 1e-9) return;   // looking straight down/up: bearing undefined, keep the last reading
  _fwd.normalize();
  let bearing = THREE.MathUtils.radToDeg(Math.atan2(_fwd.x, -_fwd.z));
  if (bearing < 0) bearing += 360;
  const card = CARDINALS[Math.round(bearing / 45) % 8];
  compassEl.textContent = card;
  compassEl.title = bearing.toFixed(0) + "°";
}

// --- Scale bar ---
//
// Computed from the actual current projection, not a fixed pixels-per-metre
// constant: at a perspective camera's distance from its target, a metre
// covers a different number of screen pixels depending on zoom, so a scale
// bar that doesn't recompute every frame is only honest at one zoom level.
// Method: project the target point and a point NICE_DISTANCES metres to its
// right (camera's own local +X, i.e. screen-horizontal in world space) into
// normalised device coordinates, convert both to pixels, and the gap is
// exactly how many screen pixels that real distance occupies right now.
const scaleBarEl = document.createElement("div");
scaleBarEl.id = "scale-bar";
scaleBarEl.style.cssText =
  "position:fixed;bottom:16px;left:16px;z-index:40;pointer-events:none;" +
  "display:flex;flex-direction:column;align-items:center;font:11px monospace;color:#cde;";
scaleBarEl.innerHTML =
  '<div id="scale-bar-track" style="height:4px;background:#cde;border-left:1px solid #cde;' +
  'border-right:1px solid #cde;"></div><div id="scale-bar-label" style="margin-top:2px;"></div>';
document.body.appendChild(scaleBarEl);
const scaleBarTrack = document.getElementById("scale-bar-track");
const scaleBarLabel = document.getElementById("scale-bar-label");

const NICE_DISTANCES_M = [0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000];
const _scaleRight = new THREE.Vector3();
const _scaleUpTmp = new THREE.Vector3();
const _scaleFwdTmp = new THREE.Vector3();
const _scaleA = new THREE.Vector3();
const _scaleB = new THREE.Vector3();

function worldToScreenPx(v) {
  const p = v.clone().project(camera);
  return { x: (p.x * 0.5 + 0.5) * window.innerWidth, y: (-p.y * 0.5 + 0.5) * window.innerHeight };
}

function updateScaleBar() {
  if (!SCENE_META) return;
  const target = controls.target;
  camera.matrixWorld.extractBasis(_scaleRight, _scaleUpTmp, _scaleFwdTmp);
  _scaleRight.y = 0;
  if (_scaleRight.lengthSq() < 1e-9) { scaleBarEl.style.display = "none"; return; }
  _scaleRight.normalize();

  // Try candidate distances from largest to smallest; use the first that
  // fits in a sane on-screen width (60-180px). Bailing out to "no candidate
  // fits" (extreme close-up or extreme distance) hides the bar rather than
  // drawing a nonsense one.
  for (let i = NICE_DISTANCES_M.length - 1; i >= 0; i--) {
    const d = NICE_DISTANCES_M[i];
    _scaleA.copy(target);
    _scaleB.copy(target).addScaledVector(_scaleRight, d);
    const pa = worldToScreenPx(_scaleA), pb = worldToScreenPx(_scaleB);
    const px = Math.abs(pb.x - pa.x);
    if (px >= 60 && px <= 180) {
      scaleBarTrack.style.width = px.toFixed(0) + "px";
      scaleBarLabel.textContent = d >= 1000 ? (d / 1000) + " km" : d + " m";
      scaleBarEl.style.display = "flex";
      return;
    }
  }
  scaleBarEl.style.display = "none";
}

// --- Compare slider: prediction vs ground truth ---
//
// Only appears on a scene built from a real LiDAR benchmark tile
// (build_city.py's ground-truth path writes compare_truth.png /
// compare_pred.png; every other scene has no such pair, and the panel
// stays hidden rather than showing a slider with nothing real behind it).
// Existence is checked by actually loading both images, not by guessing
// from scene.json, since a stale/partial build could have the field
// without the file.
const TEXTURE_COMPARE_TRUTH_URL = `${BASE}/compare_truth.png`;
const TEXTURE_COMPARE_PRED_URL = `${BASE}/compare_pred.png`;

function _imageLoads(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = url;
  });
}

const compareToggleBtn = document.createElement("button");
compareToggleBtn.id = "compare-toggle";
compareToggleBtn.textContent = "Compare: Prediction vs Ground Truth";
compareToggleBtn.style.cssText =
  "position:fixed;bottom:16px;right:16px;z-index:41;display:none;" +
  "background:rgba(10,14,20,0.8);color:#cde;border:1px solid #345;" +
  "border-radius:6px;padding:8px 12px;font:12px monospace;cursor:pointer;";
document.body.appendChild(compareToggleBtn);

const comparePanel = document.createElement("div");
comparePanel.id = "compare-panel";
comparePanel.style.cssText =
  "position:fixed;bottom:64px;right:16px;z-index:41;display:none;" +
  "background:rgba(10,14,20,0.9);border:1px solid #345;border-radius:8px;" +
  "padding:10px;color:#cde;font:11px monospace;width:420px;";
comparePanel.innerHTML =
  '<div id="compare-caption" style="margin-bottom:6px;"></div>' +
  '<div id="compare-stage" style="position:relative;width:400px;height:400px;' +
  'overflow:hidden;border:1px solid #345;">' +
  '<img id="compare-img-truth" style="position:absolute;top:0;left:0;' +
  'width:400px;height:400px;object-fit:cover;">' +
  '<img id="compare-img-pred" style="position:absolute;top:0;left:0;' +
  'width:400px;height:400px;object-fit:cover;">' +
  '<div id="compare-divider" style="position:absolute;top:0;bottom:0;width:2px;' +
  'background:#fff;pointer-events:none;"></div>' +
  '</div>' +
  '<input id="compare-range" type="range" min="0" max="100" value="50" ' +
  'style="width:400px;margin-top:6px;">' +
  '<div style="display:flex;justify-content:space-between;margin-top:2px;">' +
  '<span>← Prediction</span><span>Ground truth →</span></div>';
document.body.appendChild(comparePanel);

(async () => {
  const [truthOk, predOk] = await Promise.all([
    _imageLoads(TEXTURE_COMPARE_TRUTH_URL), _imageLoads(TEXTURE_COMPARE_PRED_URL),
  ]);
  if (!truthOk || !predOk) return;   // no real ground truth for this scene

  document.getElementById("compare-img-truth").src = TEXTURE_COMPARE_TRUTH_URL;
  document.getElementById("compare-img-pred").src = TEXTURE_COMPARE_PRED_URL;

  const v = (SCENE_META && SCENE_META.validation) || null;
  const caption = document.getElementById("compare-caption");
  caption.textContent = v
    ? `Same buildings, same colour scale (0-${v.compare_height_scale_m ?? "?"} m). ` +
      `RMSE ${v.rmse_m} m, bias ${v.bias_m >= 0 ? "+" : ""}${v.bias_m} m over the central ${v.covers_m ?? "?"} m.`
    : "Same buildings, same colour scale -- drag to compare.";

  const range = document.getElementById("compare-range");
  const predImg = document.getElementById("compare-img-pred");
  const divider = document.getElementById("compare-divider");
  function applyClip() {
    const pct = range.value;
    predImg.style.clipPath = `inset(0 ${100 - pct}% 0 0)`;
    divider.style.left = pct + "%";
  }
  range.addEventListener("input", applyClip);
  applyClip();

  compareToggleBtn.style.display = "block";
  compareToggleBtn.addEventListener("click", () => {
    const open = comparePanel.style.display === "block";
    comparePanel.style.display = open ? "none" : "block";
  });
})();

// --- Walk mode: pointer-lock first-person flythrough ---
//
// OrbitControls (above) always orbits a fixed target -- good for inspecting
// a model, wrong for the sensation of actually walking the scene. This is a
// second, independent camera-control mode: mouse-look via the browser's
// Pointer Lock API (movementX/Y deltas, not absolute position, so the
// cursor never hits a screen edge) plus WASD/Space/Shift for 6DOF motion in
// camera-local space. The two modes are mutually exclusive -- OrbitControls
// is disabled for the duration of the lock and restored the moment it's
// released (Esc, or the tab losing focus), so neither fights the other for
// the camera transform.
let walkModeActive = false;
const walkKeys = { w: false, a: false, s: false, d: false, " ": false, shift: false };
const WALK_SPEED_M_S = 60;
const _walkEuler = new THREE.Euler(0, 0, 0, "YXZ");
const _walkForward = new THREE.Vector3();
const _walkRight = new THREE.Vector3();
const _walkUp = new THREE.Vector3(0, 1, 0);

const walkToggleBtn = document.createElement("button");
walkToggleBtn.id = "walk-toggle";
walkToggleBtn.textContent = "Walk Mode (click, then WASD + mouse, Esc to exit)";
walkToggleBtn.style.cssText =
  "position:fixed;bottom:16px;left:16px;z-index:41;" +
  "background:rgba(10,14,20,0.8);color:#cde;border:1px solid #345;" +
  "border-radius:6px;padding:8px 12px;font:12px monospace;cursor:pointer;";
document.body.appendChild(walkToggleBtn);
walkToggleBtn.addEventListener("click", () => {
  renderer.domElement.requestPointerLock();
});

document.addEventListener("pointerlockchange", () => {
  walkModeActive = document.pointerLockElement === renderer.domElement;
  controls.enabled = !walkModeActive;
  walkToggleBtn.textContent = walkModeActive
    ? "Walk mode active -- Esc to return to orbit"
    : "Walk Mode (click, then WASD + mouse, Esc to exit)";
  if (walkModeActive) {
    // Carry the orbit camera's current facing into the euler used for
    // mouse-look, so entering walk mode never snaps the view.
    _walkEuler.setFromQuaternion(camera.quaternion, "YXZ");
  } else {
    for (const k of Object.keys(walkKeys)) walkKeys[k] = false;
  }
});

document.addEventListener("mousemove", (e) => {
  if (!walkModeActive) return;
  const s = 0.0022;
  _walkEuler.y -= e.movementX * s;
  _walkEuler.x -= e.movementY * s;
  _walkEuler.x = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, _walkEuler.x));
  camera.quaternion.setFromEuler(_walkEuler);
});

document.addEventListener("keydown", (e) => {
  if (!walkModeActive) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === "Shift") walkKeys.shift = true;
  else if (k in walkKeys) walkKeys[k] = true;
});
document.addEventListener("keyup", (e) => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === "Shift") walkKeys.shift = false;
  else if (k in walkKeys) walkKeys[k] = false;
});

function updateWalkMode(dt) {
  if (!walkModeActive) return;
  camera.getWorldDirection(_walkForward);
  _walkRight.crossVectors(_walkForward, _walkUp).normalize();
  const speed = WALK_SPEED_M_S * (walkKeys.shift ? 3 : 1) * dt;
  if (walkKeys.w) camera.position.addScaledVector(_walkForward, speed);
  if (walkKeys.s) camera.position.addScaledVector(_walkForward, -speed);
  if (walkKeys.d) camera.position.addScaledVector(_walkRight, speed);
  if (walkKeys.a) camera.position.addScaledVector(_walkRight, -speed);
  if (walkKeys[" "]) camera.position.y += speed;
}

// --- Flythrough video export --------------------------------------------
//
// Records exactly what the tour camera already does, straight off the
// canvas via the browser's own MediaRecorder + captureStream() -- no
// external muxing library, no server round-trip, works fully offline once
// the page is loaded. This doubles as the SIH-recommended offline backup:
// if the live link ever hiccups in front of judges, a fresh recording of
// the exact scene on screen can be made on the spot, seconds before it's
// needed, rather than relying on a stale video made days earlier.
let mediaRecorder = null;
let recordingChunks = [];

function pickRecorderMime() {
  // Chrome/Edge ship VP9 or H.264 in WebM/MP4 containers; try the most
  // broadly playable options first and fall back gracefully. If NONE are
  // supported (old browser), recording is disabled outright rather than
  // producing a file that won't open anywhere.
  const candidates = [
    "video/mp4;codecs=avc1", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm",
  ];
  for (const c of candidates) {
    if (typeof MediaRecorder !== "undefined" && MediaRecorder.isTypeSupported(c)) return c;
  }
  return null;
}

function startRecording() {
  const mime = pickRecorderMime();
  const panel = document.getElementById("query-panel");
  if (!mime) {
    if (panel) { panel.style.display = "block"; panel.textContent = "This browser can't record video -- try Chrome or Edge."; }
    return;
  }
  const stream = renderer.domElement.captureStream(30);
  recordingChunks = [];
  try {
    mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
  } catch (e) {
    if (panel) { panel.style.display = "block"; panel.textContent = "Recording failed to start: " + e.message; }
    return;
  }
  mediaRecorder.ondataavailable = (e) => { if (e.data.size) recordingChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordingChunks, { type: mime.split(";")[0] });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "depthwizard_flythrough." + (mime.includes("mp4") ? "mp4" : "webm");
    a.click();
    URL.revokeObjectURL(a.href);
  };

  // Drive the tour if it isn't already running, so pressing Record alone is
  // enough -- and remember whether the tour was already going, so stopping
