  // the recording doesn't stop a tour the user started independently.
  const wasTourActive = tourActive;
  if (!tourActive && btnTour) btnTour.click();
  mediaRecorder.start();

  const recordBtn = document.getElementById("btn-record");
  if (recordBtn) { recordBtn.textContent = "Stop Recording"; recordBtn.classList.add("active"); }

  // One full 60s tour loop, then auto-stop -- long enough to show the whole
  // circuit, short enough that "Record Flythrough" can't be left running
  // and forgotten through an entire demo.
  const autoStopId = setTimeout(() => stopRecording(wasTourActive), 60_000);
  mediaRecorder._autoStopId = autoStopId;
  mediaRecorder._wasTourActive = wasTourActive;
}

function stopRecording(wasTourActive) {
  if (!mediaRecorder || mediaRecorder.state === "inactive") return;
  clearTimeout(mediaRecorder._autoStopId);
  const restoreTour = wasTourActive !== undefined ? wasTourActive : mediaRecorder._wasTourActive;
  mediaRecorder.stop();
  mediaRecorder = null;
  if (!restoreTour && tourActive && btnTour) btnTour.click();   // only stop the tour if THIS action started it
  const recordBtn = document.getElementById("btn-record");
  if (recordBtn) { recordBtn.textContent = "Record Flythrough"; recordBtn.classList.remove("active"); }
}

(() => {
  const recordBtn = document.getElementById("btn-record");
  if (!recordBtn) return;
  if (typeof MediaRecorder === "undefined" || !renderer.domElement.captureStream) return;
  recordBtn.style.display = "inline-block";
  recordBtn.addEventListener("click", () => {
    if (mediaRecorder && mediaRecorder.state !== "inactive") stopRecording();
    else startRecording();
  });
})();

// --- Scene query -------------------------------------------------------
//
// A text box that answers real questions about the actual buildings in this
// scene ("which buildings are over 15m with low confidence") by filtering
// BUILDING_RECORDS -- the exact same evidence-trail data the click-a-
// building readout already reports, so an answer here is never a number the
// query engine invented; it can only ever surface what the pipeline already
// computed. This keyword parser is deliberately built and shipped FIRST as
// the reliable base: a later, optional AI layer (translating free-form
// English into the same filter shape) only ever REPLACES how the filter
// gets constructed, never what answers it -- if that layer fails to load or
// errors, this keeps working exactly as it does right now.
function extractComparison(q, keywordRe) {
  const idx = q.search(keywordRe);
  if (idx < 0) return null;
  // Looks both directions from the anchor -- "measured buildings UNDER 10m"
  // has the direction word BEFORE the number, which a forward-only window
  // starting at the anchor would miss entirely (verified by testing: it
  // silently defaulted "under 10m" to ">=" instead of "<=" before this).
  const window = q.slice(Math.max(0, idx - 20), idx + 40);
  const numMatch = window.match(/(-?\d+(?:\.\d+)?)/);
  if (!numMatch) return null;
  const value = parseFloat(numMatch[1]);
  const isLess = /(<|under|below|less than|fewer than|shorter than|at most)/.test(window);
  const isGreater = /(>|over|above|greater than|more than|taller than|at least|exceeding)/.test(window);
  const op = (isLess && !isGreater) ? "<=" : ">=";   // default: "over/above X" is the common phrasing
  return { op, value };
}

function parseSceneQuery(text) {
  const q = text.toLowerCase();
  const filters = [];
  // Tracks whether some OTHER clause already claimed a number in the
  // string -- a phrase match like "low confidence" or "inferred" claims no
  // digit at all, so a trailing "over 15m" in the same sentence must still
  // reach the height fallback below. Only a genuine numeric match (confidence
  // N, area N) should block it, or "buildings over 15m with low confidence"
  // would silently lose its height clause entirely -- a real bug caught by
  // testing this against actual phrasings, not a hypothetical one.
  let numericClaimed = false;

  const conf = extractComparison(q, /confidence/);
  if (conf) { filters.push({ field: "confidence", ...conf }); numericClaimed = true; }
  else if (/low confidence|weakly constrained|uncertain/.test(q)) filters.push({ field: "confidence", op: "<=", value: 0.5 });
  else if (/high confidence|well constrained|\bconfident\b|\breliable\b/.test(q)) filters.push({ field: "confidence", op: ">=", value: 0.7 });

  if (/\bmeasured\b/.test(q)) filters.push({ field: "provenance", op: "==", value: "MEASURED" });
  else if (/\binferred\b/.test(q)) filters.push({ field: "provenance", op: "==", value: "INFERRED" });

  const area = extractComparison(q, /area|footprint/);
  if (area) { filters.push({ field: "area_m2", ...area }); numericClaimed = true; }

  const height = extractComparison(q, /height|tall|storey|storeys|floor/);
  if (height) {
    filters.push({ field: "height_m", ...height });
  } else if (!numericClaimed) {
    // No metric keyword recognised at all -- if there's still a bare
    // comparator+number, assume height, since "buildings over 15m" (no
    // explicit word "height") is the single most natural phrasing this
    // parser needs to get right.
    const bare = extractComparison(q, /\d/);
    if (bare) filters.push({ field: "height_m", ...bare });
  }

  return filters;
}

function applySceneFilters(records, filters) {
  return records.filter((rec) => {
    const p = rec.props || {};
    return filters.every((f) => {
      const v = p[f.field];
      if (v === undefined || v === null) return false;
      if (f.op === "==") return String(v).toUpperCase() === String(f.value).toUpperCase();
      if (f.op === ">=") return v >= f.value;
      if (f.op === "<=") return v <= f.value;
      return false;
    });
  });
}

let queryHighlightGroup = null;

function clearQueryHighlights() {
  if (queryHighlightGroup) { scene.remove(queryHighlightGroup); queryHighlightGroup = null; }
}

function highlightMatches(matches) {
  clearQueryHighlights();
  if (!matches.length || !groundMesh) return;
  const ox = SCENE_META.origin_x || 0, oy = SCENE_META.origin_y || 0;
  const datum = new THREE.Box3().setFromObject(groundMesh).min.y;
  queryHighlightGroup = new THREE.Group();
  queryHighlightGroup.name = "query-highlights";

  for (const rec of matches) {
    if (!rec.ring || rec.ring.length < 3) continue;
    const pts = rec.ring.map((pt) => new THREE.Vector2(pt[0] - ox, -(pt[1] - oy)));
    let shape;
    try { shape = new THREE.Shape(pts); } catch (e) { continue; }
    const h = rec.props.height_m || 1.0;
    const geo = new THREE.ExtrudeGeometry(shape, { depth: h + 1.5, bevelEnabled: false });
    geo.rotateX(-Math.PI / 2);
    const gy = sampleGroundAt(rec.cx - ox, rec.cy - oy, datum);
    const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color: 0xffcc33, transparent: true, opacity: 0.35, depthWrite: false,
    }));
    mesh.position.y = gy - 0.5;
    mesh.renderOrder = 5;
    queryHighlightGroup.add(mesh);
  }
  scene.add(queryHighlightGroup);
}

function flyToMatches(matches) {
  if (!matches.length) return;
  const ox = SCENE_META.origin_x || 0, oy = SCENE_META.origin_y || 0;
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (const rec of matches) {
    const x = rec.cx - ox, z = rec.cy - oy;
    minX = Math.min(minX, x); maxX = Math.max(maxX, x);
    minZ = Math.min(minZ, z); maxZ = Math.max(maxZ, z);
  }
  const cx = (minX + maxX) / 2, cz = (minZ + maxZ) / 2;
  const span = Math.max(20, Math.max(maxX - minX, maxZ - minZ) * 1.6);
  controls.target.set(cx, 0, cz);
  camera.position.set(cx + span * 0.5, span * 0.7, cz + span * 0.5);
  controls.update();
}

function runSceneQuery(text) {
  const panel = document.getElementById("query-panel");
  panel.style.display = "block";
  if (!BUILDING_RECORDS || !BUILDING_RECORDS.length) {
    panel.textContent = "No building data loaded for this scene.";
    return;
  }
  const filters = parseSceneQuery(text);
  if (!filters.length) {
    panel.textContent = "Couldn't parse that. Try: \"buildings over 15m\", "
      + "\"low confidence buildings\", \"measured buildings under 10m\", "
      + "\"area over 200\".";
    clearQueryHighlights();
    return;
  }
  const matches = applySceneFilters(BUILDING_RECORDS, filters);
  const desc = filters.map((f) =>
    `${f.field} ${f.op === "==" ? "=" : f.op} ${f.value}`).join(" and ");
  if (!matches.length) {
    panel.textContent = `0 buildings match (${desc}).`;
    clearQueryHighlights();
    return;
  }
  panel.textContent = `${matches.length} building(s) match (${desc}) -- highlighted in amber.`;
  highlightMatches(matches);
  flyToMatches(matches);
}

document.getElementById("btn-query").addEventListener("click", () => {
  const input = document.getElementById("query-input");
  if (input.value.trim()) runSceneQuery(input.value.trim());
});
document.getElementById("query-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.value.trim()) runSceneQuery(e.target.value.trim());
});

// --- Render loop ---
const _clock = new THREE.Clock();
function animate() {
  // Real elapsed time, not a fixed per-frame step: the tour must take the same
  // 60 seconds whether the renderer is managing 120 fps or 20.
  const dt = _clock.getDelta();
  updateTour(dt);
  updateWalkMode(dt);
  if (!walkModeActive) controls.update();
  updateCompass();
  updateScaleBar();
  if (postProcessing) { postProcessing.render(); } else { renderer.render(scene, camera); }
  servicePendingCapture();
}
renderer.setAnimationLoop(animate); // WebGPURenderer's own loop driver, handles both backends correctly

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
