<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DepthWizard 3D Terrain Viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
  /* touch-action: none on the canvas itself -- without it, mobile Safari/
     Chrome intercept a two-finger pinch as native page-zoom (or a one-finger
     drag as scroll) before OrbitControls' own pointer handlers ever see the
     gesture. OrbitControls already implements one-finger-rotate/two-finger-
     pinch-zoom internally; this is the one CSS property standing between
     "already works" and "the browser eats the gesture first". */
  #canvas-container { width: 100%; height: 100%; touch-action: none; }
  #canvas-container canvas { touch-action: none; }
  #ui {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(20,20,25,0.75); backdrop-filter: blur(6px);
    border-radius: 10px; padding: 12px 14px; color: #eee; font-size: 13px;
    min-width: 220px;
    /* Capped so the button rows wrap into a narrow column instead of
       sprawling across most of the viewport -- with every tool row present
       (Record Flythrough, Ground Control, Measure Area, ...) an unbounded
       width let the panel cover the model it's meant to be a HUD over. */
    max-width: 280px;
    /* The panel accumulates sections (tools, measure readout, a 320x120
       cross-section canvas, GCP rows, sliders) that can exceed a short
       viewport -- a 1366x768 hall laptop with browser chrome eating into
       that leaves well under 700px of usable height. Without this, controls
       below the fold are simply unreachable, not just ugly. */
    max-height: calc(100vh - 24px);
    overflow-y: auto;
  }
  #ui.collapsed { padding: 8px 10px; }
  #ui.collapsed > *:not(#btn-collapse) { display: none; }
  #btn-collapse {
    position: absolute; top: 6px; right: 6px; z-index: 11;
    background: rgba(20,20,25,0.75); color: #9ab; border: 1px solid #345;
    border-radius: 6px; width: 22px; height: 22px; font-size: 12px;
    line-height: 1; cursor: pointer; padding: 0;
  }
  #ui h3 { margin: 0 0 8px; font-size: 14px; color: #9fd; }
  .row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  button {
    background: #23252b; color: #ddd; border: 1px solid #444; border-radius: 6px;
    padding: 6px 10px; cursor: pointer; font-size: 12px;
  }
  button.active { background: #2f6b4f; border-color: #4fbf8f; color: #fff; }
  button:hover { border-color: #7fd; }
  #measure-panel { margin-top: 8px; font-size: 12px; line-height: 1.5; color: #cde; white-space: pre-line; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #ccc; font-size: 16px; z-index: 20; background: #05070a;
  }
  #stats { margin-top: 8px; font-size: 11px; color: #899; white-space: pre-line; }
  #xsec { display:none; margin-top:8px; width:100%; max-width:320px;
           border-radius:4px; border:1px solid rgba(255,255,255,0.12); }
  .slider-row { display:flex; align-items:center; gap:7px; margin-top:7px; }
  .slider-row label { font-size:11px; color:#9ab; min-width:38px;
                      letter-spacing:0.04em; text-transform:uppercase; }
  .slider-row input[type=range] { flex:1; accent-color:#6ab6cd; }
  .readout { font-size:11px; color:#9cb3c2; margin-top:3px;
             font-variant-numeric:tabular-nums; }
  #gcp-panel { display:none; margin-top:8px; font-size:12px; }
  .gcp-hint { color:#9ab; line-height:1.45; }
  .gcp-row { display:flex; align-items:center; gap:6px; padding:3px 0;
             border-bottom:1px solid rgba(255,255,255,0.07);
             font-variant-numeric:tabular-nums; }
  .gcp-row.suspect { color:#e0a05a; }
  .gcp-m { color:#9ab; min-width:38px; }
  .gcp-arrow { color:#6b7883; }
  .gcp-k { min-width:54px; }
  .gcp-r { margin-left:auto; color:#9ab; min-width:54px; text-align:right; }
  .gcp-drop { background:none; border:0; color:#7a8891; cursor:pointer;
              font-size:15px; line-height:1; padding:0 2px; }
  .gcp-drop:hover { color:#e2807a; }
  .gcp-sum { margin-top:7px; color:#cde; font-variant-numeric:tabular-nums; }
  .gcp-warn { margin-top:6px; color:#e0a05a; line-height:1.4; }
  .gcp-apply { margin-top:8px; width:100%; background:#2f6b4a; border:0;
               color:#eaf3ed; font:inherit; font-size:12px; padding:6px;
               border-radius:4px; cursor:pointer; }
  .gcp-apply:hover { background:#3a7f59; }
  #dmg-panel { display:none; margin-top:8px; font-size:12px; }
  .dmg-head { font-weight:600; color:#e6edf3; margin-bottom:4px; }
  .dmg-gate { color:#8b9aa8; line-height:1.4; margin-bottom:7px; }
  .dmg-sim { color:#e0a05a; border:1px solid #6a4f22; background:#2a2113;
             padding:5px 7px; border-radius:3px; line-height:1.4;
             margin-bottom:7px; }
  .dmg-counts { display:flex; flex-wrap:wrap; gap:4px 12px; margin-bottom:8px; }
  .dmg-c { display:flex; align-items:center; gap:5px; color:#cde; }
  .dmg-c b { margin-left:3px; font-variant-numeric:tabular-nums; }
  .dmg-sw { width:9px; height:9px; border-radius:2px; flex:none; }
  .dmg-list { border-top:1px solid rgba(255,255,255,0.09); }
  .dmg-row { display:flex; align-items:center; gap:7px; padding:2px 0;
             font-variant-numeric:tabular-nums; color:#b8c6d1; }
  .dmg-h { min-width:78px; }
  .dmg-d { margin-left:auto; }
</style>
</head>
<body>
<div id="loading">Loading terrain...</div>
<div id="canvas-container"></div>

<div id="ui" style="display:none;">
  <button id="btn-collapse" title="Collapse panel">&#8722;</button>
  <h3>DepthWizard</h3>
  <div class="row">
    <button id="btn-rgb" class="active">RGB</button>
    <button id="btn-heatmap">HEATMAP</button>
    <button id="btn-conf">CONFIDENCE</button>
    <button id="btn-err">VS LiDAR</button>
  </div>
  <div class="row">
    <button id="btn-measure">Measure Height</button>
    <button id="btn-reset">Reset View</button>
  </div>
  <div class="row">
    <button id="btn-dof">Tilt-Shift</button>
    <button id="btn-tour">Flythrough</button>
    <button id="btn-record" style="display:none;">Record Flythrough</button>
  </div>
  <div class="row">
    <button id="btn-slope">SLOPE</button>
    <button id="btn-los">Line of Sight</button>
    <button id="btn-xsec">Cross-Section</button>
    <button id="btn-area">Measure Area</button>
    <button id="btn-gcp">Ground Control</button>
    <button id="btn-flood">Flood Source</button>
    <button id="btn-bands">Uncertainty</button>
    <button id="btn-damage">Damage</button>
    <button id="btn-annotate">Add Pin</button>
  </div>
  <div id="dmg-panel"></div>
  <div id="gcp-panel"></div>
  <div id="pin-panel" style="display:none;"></div>
  <div class="row">
    <button id="btn-pdf">Export PDF</button>
    <button id="btn-pins-export" style="display:none;">Export Pins</button>
    <button id="btn-xr" style="display:none;">Enter VR</button>
  </div>
  <div class="row" style="margin-top:4px;">
    <input id="query-input" type="text" placeholder="e.g. buildings over 15m with low confidence"
           style="flex:1;background:#1a1c22;color:#ddd;border:1px solid #444;border-radius:6px;
                  padding:6px 10px;font-size:12px;">
    <button id="btn-query">Ask</button>
  </div>
  <div id="query-panel" style="display:none;font-size:12px;color:#cde;margin-top:6px;line-height:1.5;"></div>
  <div class="slider-row">
    <label for="flood">Flood</label>
    <input type="range" id="flood" min="0" max="60" step="0.5" value="0">
  </div>
  <div class="readout" id="flood-readout">Water off</div>
  <div class="slider-row">
    <label for="sunhr">Sun</label>
    <input type="range" id="sunhr" min="6" max="18" step="0.25" value="10.5">
  </div>
  <div class="readout" id="sun-readout">10:30   (matches capture)</div>
  <canvas id="xsec" width="320" height="120"></canvas>
  <div id="measure-panel">Click a building to read its height.</div>
  <div id="stats"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three@0.180.0/build/three.webgpu.js",
    "three/webgpu": "./vendor/three@0.180.0/build/three.webgpu.js",
    "three/tsl": "./vendor/three@0.180.0/build/three.tsl.js",
    "three/addons/": "./vendor/three@0.180.0/examples/jsm/"
  }
}
</script>
<!-- Vendored locally under viewer/vendor/ so this page opens and renders with
     zero internet access -- the CDN version this replaced (unpkg.com) meant
     the viewer could not render at all offline or on a network that blocks
     that host, silently, with no error message a viewer would see. -->

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

// ---------------------------------------------------------------------
// Config: which mesh/texture to load. Point MESH_URL at your run_pipeline.py
// output (mesh_generation.generate_mesh's out_path/texture_path/heatmap_path).
// ---------------------------------------------------------------------
// Scene root. Defaults to ./output (whatever the pipeline last staged), but a
// ?scene=<name> parameter points at a pre-built scene under /scenes/<name>/.
// That is what lets a gallery serve several finished cities without copying one
// of them over the others, which is how scenes.py restore works and why only
// one scene could exist at a time.
const _params = new URLSearchParams(location.search);
const _scene = _params.get("scene");
const BASE = _scene ? `/scenes/${encodeURIComponent(_scene)}` : "./output";

const MESH_URL = `${BASE}/terrain.glb`;
const TEXTURE_RGB_URL = `${BASE}/terrain_texture.png`;
const TEXTURE_HEATMAP_URL = `${BASE}/terrain_heatmap.png`;
const TEXTURE_CONF_URL = `${BASE}/terrain_confidence.png`;
const TEXTURE_ERR_URL = `${BASE}/terrain_error.png`;
// Raw (non-colourised) versions of the two above, for live hover sampling --
// exact values read from a canvas, not a colour inverted back into a guess.
const TEXTURE_CONF_RAW_URL = `${BASE}/terrain_confidence_raw.png`;
const TEXTURE_ERR_RAW_URL = `${BASE}/terrain_error_raw.png`;
const TEXTURE_SLOPE_URL = `${BASE}/terrain_slope.png`;
const TEXTURE_NORMAL_URL = `${BASE}/terrain_normal.png`;
const TEXTURE_AO_URL = `${BASE}/terrain_ao.png`;
const TEXTURE_ROUGHNESS_URL = `${BASE}/terrain_roughness.png`;
const TEXTURE_METALNESS_URL = `${BASE}/terrain_metalness.png`;
// Sun angles come from the capture metadata written by build_scene.py, not
// from a chosen-looking-good constant. The satellite texture has the real
// shadows baked into it, so lighting the geometry from a different direction
// puts a second set of shadows across the scene at odds with the first --
// which reads immediately as fake. Defaults apply only when scene.json is
// absent (a mesh built by an older run).
let SUN_ELEVATION_DEG = 40;
let SUN_AZIMUTH_DEG = 200;
let SCENE_META = null;
try {
  const r = await fetch(`${BASE}/scene.json`, { cache: "no-store" });
  if (r.ok) {
    SCENE_META = await r.json();
    if (typeof SCENE_META.sun_elevation_deg === "number") SUN_ELEVATION_DEG = SCENE_META.sun_elevation_deg;
    if (typeof SCENE_META.sun_azimuth_deg === "number") SUN_AZIMUTH_DEG = SCENE_META.sun_azimuth_deg;
  }
} catch (e) { /* no metadata: keep the defaults above */ }

// ITEM 6: the evidence trail.
//
// The pipeline already records, per building, which channels supported it
// (height, roof edge, texture, shadow), how confident the photometry was, and
// whether its height is MEASURED or merely INFERRED. All of that was exported
// to GeoJSON and then only reachable by opening a spreadsheet. Loading it here
// turns the model from a black box into something that can be interrogated
// building by building.
let BUILDING_RECORDS = null;
try {
  const rb = await fetch(`${BASE}/buildings.geojson`, { cache: "no-store" });
  if (rb.ok) {
    const gj = await rb.json();
    BUILDING_RECORDS = (gj.features || []).map((f) => {
      const ring = (f.geometry && f.geometry.coordinates && f.geometry.coordinates[0]) || [];
      let sx = 0, sy = 0;
      for (const pt of ring) { sx += pt[0]; sy += pt[1]; }
      // The ring is kept, not just its centroid: the uncertainty bands are
      // drawn over each building's actual footprint, and a centroid cannot be
      // extruded into one.
      return { props: f.properties || {}, ring,
               cx: ring.length ? sx / ring.length : 0,
               cy: ring.length ? sy / ring.length : 0 };
    });
  }
} catch (e) { /* evidence trail unavailable; height still works */ }

// WebGPURenderer: uses the browser's WebGPU backend when available (Chrome/
// Edge/Firefox/Safari all ship it as of late 2025), and automatically falls
// back to WebGL2 when it isn't -- same class either way, so nothing else in
// this file needs to know which backend actually ran. Needs an async init()
// before first render, unlike WebGLRenderer.
const container = document.getElementById("canvas-container");
const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
// AgX rather than ACES. ACES pushes bright neutrals toward warm cream and
// crushes highlight separation -- on a city of pale roofs that turns the whole
// scene yellow-white and flattens roof-to-roof value differences, which is
// exactly the information the model is trying to show. AgX holds neutrals
// neutral and keeps highlight detail, which suits a cool palette.
renderer.toneMapping = THREE.AgXToneMapping || THREE.ACESFilmicToneMapping;
// Exposure is set for a mid-grey satellite frame. Brighter sources (a sunlit
// campus at 25 cm/px) clip to white at 1.45 and lose both the ground texture
// and the canopy, so this sits lower and lets AgX's highlight rolloff work.
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;  // soft penumbra, not hard-edged stencils
container.appendChild(renderer.domElement);

// Demo-hall hardening, part 1: a laptop with no working GPU (disabled
// drivers, a remote-desktop session with no 3D passthrough, an ancient
// browser) must not fail as a blank canvas and a console error nobody in
// the room can see. WebGPURenderer already falls back to WebGL2 on its own
// (comment above); this catches the case where BOTH backends are
// unavailable, which is the actual "nothing will render here" case.
try {
  await renderer.init();
} catch (initErr) {
  container.innerHTML =
    '<div style="position:fixed;inset:0;display:flex;align-items:center;' +
    'justify-content:center;background:#0a0e14;color:#cde;font:15px sans-serif;' +
    'text-align:center;padding:24px;">' +
    '<div style="max-width:480px;">' +
    '<div style="font-size:32px;margin-bottom:12px;">&#9888;</div>' +
    '<div style="font-weight:bold;margin-bottom:8px;">This browser/device has no ' +
    'working 3D graphics.</div>' +
    '<div style="color:#9ab;font-size:13px;line-height:1.5;">Try the latest Chrome ' +
    'or Edge, make sure hardware acceleration is enabled in browser settings, and ' +
    'update GPU drivers if this is a physical machine. A remote-desktop session ' +
    'without 3D passthrough will not render this viewer.</div>' +
    '<div style="color:#678;font-size:11px;margin-top:14px;">(' +
    String(initErr && initErr.message || initErr).slice(0, 200) + ')</div>' +
    '</div></div>';
  throw initErr;   // stop here -- nothing below can run without a renderer
}

// Demo-hall hardening, part 2: recover from a lost graphics context instead
// of freezing on the last rendered frame. A projector swap, a driver reset,
// or the OS reclaiming GPU memory under load can all kill the context mid-
// demo, and the default behaviour is a silently frozen canvas that looks
// exactly like a crash to everyone watching. This does not attempt to
// reconstruct GPU resources in place -- Three.js's resource graph after a
// context loss is large enough that an untested in-place recovery path is
// itself a demo-day risk -- instead it shows a clear, honest message and
// reloads automatically, which is a real, verifiable recovery rather than a
// seamless-looking one that has never been tested against real hardware.
let _contextLostBadge = null;
function _showContextLostBadge(text) {
  if (_contextLostBadge) return;
  _contextLostBadge = document.createElement("div");
  _contextLostBadge.style.cssText =
    "position:fixed;inset:0;z-index:9999;display:flex;align-items:center;" +
    "justify-content:center;background:rgba(10,14,20,0.92);color:#cde;" +
    "font:15px sans-serif;text-align:center;";
  _contextLostBadge.innerHTML =
    '<div>' + text + '<br><span style="color:#9ab;font-size:12px;">reloading...</span></div>';
  document.body.appendChild(_contextLostBadge);
}
renderer.domElement.addEventListener("webglcontextlost", (e) => {
  e.preventDefault();
  _showContextLostBadge("Graphics context lost.");
  setTimeout(() => window.location.reload(), 2000);
}, false);
renderer.domElement.addEventListener("webglcontextrestored", () => {
  // Reached only if the reload above hasn't already fired; a fresh load is
  // simpler and more trustworthy than resuming mid-scene.
  window.location.reload();
}, false);
// Real WebGPU (not the WebGL2 fallback) reports device loss through a
// different API -- the GPUDevice's own `.lost` promise, not a DOM event.
// Introspecting Three.js's internal backend object is version-fragile, so
// this is wrapped defensively: if it can't find the device, it silently
// skips rather than breaking renderer init over a best-effort extra check.
try {
  const gpuDevice = renderer.backend && renderer.backend.device;
  if (gpuDevice && gpuDevice.lost && typeof gpuDevice.lost.then === "function") {
    gpuDevice.lost.then((info) => {
      _showContextLostBadge("Graphics device lost" + (info && info.message ? ": " + info.message : "") + ".");
      setTimeout(() => window.location.reload(), 2000);
    });
  }
} catch (e) { /* best-effort only */ }

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 20000);
camera.position.set(0, 300, 400);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.screenSpacePanning = false;
controls.maxPolarAngle = Math.PI * 0.495; // don't let camera dip below ground plane

// --- Sky: gradient background, not the physically-based Sky.js shader.
// Sky.js is built on classic THREE.ShaderMaterial + UniformsUtils, which the
// WebGPURenderer module (three/webgpu) doesn't export -- confirmed by an
// actual runtime error when tried ("no export named UniformsUtils"), not a
// guess. A TSL-based sky shader would be the real WebGPU-native equivalent,
// but writing one untested risks the same silent-breakage problem this whole
// renderer swap was trying to avoid. Simple, guaranteed-compatible gradient
// instead of a broken or unverified shader.
function makeSkyGradient(sunDir) {
  // 1024x512 equirectangular with a real sun disc, not a 2x256 vertical ramp.
  //
  // The old gradient had no directional content at all, so PMREM prefiltered it
  // into a flat dome: every specular highlight in the scene was the same soft
  // grey wash regardless of where the sun was. A sun disc plus its surrounding
  // glow gives the environment an actual bright spot, which is what produces a
  // readable highlight on water, glass and metal.
  const W = 1024, H = 512;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d");

  // Vertical sky gradient: deep zenith -> pale horizon -> ground bounce.
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0.00, "#2f5d94");
  grad.addColorStop(0.30, "#5f8fc4");
  grad.addColorStop(0.47, "#b9d2e8");
  grad.addColorStop(0.50, "#dce7f0");   // horizon
  // BELOW the horizon. This half is visible as backdrop whenever the camera
  // looks down at the terrain, which is most of the time here -- painting it as
  // dark warm "ground bounce" turned the whole sky grey-brown. It is now a pale
  // atmospheric haze that the terrain edge fades into, while still sitting
  // slightly darker and warmer than the sky so image-based lighting keeps a
  // real up/down gradient.
  grad.addColorStop(0.53, "#c6d2dd");
  grad.addColorStop(0.70, "#aeb8c2");
  grad.addColorStop(1.00, "#97a0aa");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  if (sunDir) {
    // Place the disc by converting the sun vector to equirectangular UV.
    const theta = Math.atan2(sunDir.z, sunDir.x);
    const phi = Math.acos(THREE.MathUtils.clamp(sunDir.y, -1, 1));
    const sx = ((theta / (Math.PI * 2)) + 0.5) * W;
    const sy = (phi / Math.PI) * H;

    const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, W * 0.16);
    glow.addColorStop(0.00, "rgba(255,246,224,0.95)");
    glow.addColorStop(0.10, "rgba(255,238,206,0.55)");
    glow.addColorStop(0.35, "rgba(214,226,238,0.18)");
    glow.addColorStop(1.00, "rgba(255,255,255,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    ctx.beginPath();
    ctx.arc(sx, sy, W * 0.012, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,252,242,1)";
    ctx.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}



// --- Image-based lighting -------------------------------------------------
// A directional light plus flat ambient makes every surface respond to light
// identically, which is the main reason untextured geometry reads as "pasted
// on". Real surfaces are lit by the whole sky hemisphere and the ground
// bounce. PMREM prefilters an environment into the mip chain that
// MeshStandardMaterial samples for specular response, so roofs pick up sky
// colour at grazing angles and water reflects rather than just brightening.
//
// The environment is generated procedurally from the same sky/sun parameters
// used for the visible background, so lighting and backdrop stay consistent.
function buildEnvironment(skyTexture) {
  // ONE sky texture drives both the visible backdrop and the image-based
  // lighting. They used to be built separately -- a 2x256 vertical ramp for the
  // background and a separate 256x128 dome for PMREM -- which meant the sky you
  // saw and the sky lighting the geometry were different images, and could drift
  // apart on any edit. Prefiltering the same texture makes them agree by
  // construction.
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const envRT = pmrem.fromEquirectangular(skyTexture);
  pmrem.dispose();
  return envRT.texture;
}

function sunDirectionFromAngles(elevationDeg, azimuthDeg) {
  const phi = THREE.MathUtils.degToRad(90 - elevationDeg);
  const theta = THREE.MathUtils.degToRad(azimuthDeg);
  return new THREE.Vector3().setFromSphericalCoords(1, phi, theta);
}

const sunDir = sunDirectionFromAngles(SUN_ELEVATION_DEG, SUN_AZIMUTH_DEG);
const skyTexture = makeSkyGradient(sunDir);
scene.background = skyTexture;
scene.environment = buildEnvironment(skyTexture);

// --- Lighting: sun matches the Sky + feeds shadow map ---
// Position/frustum are placeholders here (0,0,0-centered) -- the terrain mesh
// isn't centered at the world origin (its bounding box can sit anywhere,
// e.g. X:0-850 Z:0-636), and DirectionalLight's shadow camera looks at
// light.target, which defaults to (0,0,0). Left unset, the shadow frustum
// doesn't cover the actual geometry, and out-of-frustum shadow-map sampling
// renders as solid black -- both get repositioned to the mesh's real
// bounding-box center once it loads, below.
// Warm key against cool fill. A neutral sun on a neutral ambient gives a flat
// grey city; the temperature split is what separates a sunlit roof plane from a
// shaded wall without touching geometry.
const sunLight = new THREE.DirectionalLight(0xffeed4, 3.1);
sunLight.castShadow = true;
// 2k shadow map: 4k looked marginally crisper but is disproportionately
// expensive on integrated GPUs, and PCF-soft filtering plus normalBias
// already removes the stair-stepping that motivated the larger map.
sunLight.shadow.mapSize.set(4096, 4096);
sunLight.shadow.bias = -0.0004;
sunLight.shadow.normalBias = 0.02;   // stops self-shadow acne on the heightfield
sunLight.shadow.radius = 2;          // softens the penumbra edge
scene.add(sunLight);
scene.add(sunLight.target);

// Ambient and hemisphere are now backups only -- scene.environment (PMREM)
// supplies the sky/ground illumination. Leaving the old flat values in would
// double-light the scene and wash out exactly the occlusion contrast the
// baked AO map exists to provide.
scene.add(new THREE.AmbientLight(0x8fa8c4, 0.10));
scene.add(new THREE.HemisphereLight(0x9dc0f0, 0x53585e, 0.28));

// Fog: cheap atmospheric depth cue, also gracefully hides the low-poly far
// edges of the ground mesh instead of a hard silhouette against empty sky.
// Atmospheric perspective, tinted to the sky it fades into. Distance haze is
// the strongest depth cue available at city scale and costs nothing.
scene.fog = new THREE.Fog(0xb9d2e8, 1, 4000);

// --- Post-processing: ground-truth ambient occlusion ---------------------
//
// AO is the single largest visual gain for a model like this. The buildings
// are near-untextured volumes, so the only cues separating a wall from the
// ground it stands on are the sun angle and the contact shadow in the crease
// between them. Without occlusion, blocks appear to hover; with it, they sit.
//
// This is the WebGPU-native TSL post-processing path (an MRT pass feeding
// GTAO), NOT the old EffectComposer chain. That distinction matters here: an
// EffectComposer + UnrealBloomPass chain was tried against WebGPURenderer
// earlier in this project and reproducibly rendered half the viewport black.
// The TSL path is built for this renderer.
//
// It is wrapped in try/catch and falls back to plain rendering, because a
// scene that renders without AO is strictly better than a scene that does not
// render.
// The TSL symbols are pulled in with a DYNAMIC import inside try/catch. A
// static top-level `import { ao } from "three/tsl"` cannot be guarded: if the
// installed three build names that node differently, the import itself throws,
// the whole module fails to evaluate, and the page renders nothing at all.
// Measured exactly that -- an 8KB blank screenshot. A dynamic import lets a
// missing symbol degrade to "no AO" instead of "no viewer".
// Post chain: GTAO -> denoise -> bloom -> FXAA.
//
// Order matters and each stage earns its place:
//   GTAO    contact shadows, so volumes sit on the ground instead of hovering
//   denoise GTAO is stochastic; raw output is visibly grainy on flat roofs
//   bloom   a narrow highlight-only bleed; sunlit roofs and water gain presence
//   FXAA    the scene is nothing but long straight roof edges, which alias badly
//
// Every stage is optional and resolved by dynamic import inside try/catch. A
// static top-level TSL import cannot be guarded: a missing symbol stops the whole
// module evaluating and the page renders NOTHING -- measured once as an 8KB blank
// screenshot. Degrading to "fewer effects" must never become "no viewer".
let postProcessing = null;
let postChain = [];
let dofEnabled = false;      // toggled from the UI; see the DOF block below
let rebuildPostChain = () => {};

async function buildPostChain() {
  // Chain: GTAO -> denoise -> SSR -> DOF -> bloom -> TRAA
  //
  // Each stage is resolved by DYNAMIC import inside try/catch and is
  // individually optional. A static top-level TSL import cannot be guarded: if
  // one symbol is missing the module never evaluates and the page renders
  // nothing at all -- measured once as an 8KB blank screenshot. Degrading to
  // "fewer effects" must never become "no viewer".
  postChain = [];
  try {
    const tsl = await import("three/tsl");
    const { ao: aoFn } = await import("three/addons/tsl/display/GTAONode.js");
    if (!aoFn || !tsl.pass || !tsl.mrt || !THREE.PostProcessing) {
      throw new Error("TSL post-processing nodes unavailable in this three build");
    }

    const scenePass = tsl.pass(scene, camera);
    // MRT declares every buffer a later stage consumes. SSR needs metalness and
    // roughness; requesting them here is what makes one render feed several
    // effects instead of re-rendering the scene per effect.
    const mrtSpec = { output: tsl.output, normal: (tsl.normalView || tsl.transformedNormalView) };
    if (tsl.metalness) mrtSpec.metalness = tsl.metalness;
    if (tsl.roughness) mrtSpec.roughness = tsl.roughness;
    scenePass.setMRT(tsl.mrt(mrtSpec));
    const colorNode = scenePass.getTextureNode("output");
    const normalNode = scenePass.getTextureNode("normal");
    const depthNode = scenePass.getTextureNode("depth");

    // --- ambient occlusion -------------------------------------------------
    // The largest single gain for near-untextured volumes: without contact
    // shadows in the crease between a wall and the ground, blocks appear to
    // hover rather than stand.
    const aoNode = aoFn(depthNode, normalNode, camera);
    if (aoNode.radius) aoNode.radius.value = 0.4;
    if (aoNode.scale) aoNode.scale.value = 1.25;
    if (aoNode.thickness) aoNode.thickness.value = 1.0;
    postChain.push("gtao");

    let aoTex = aoNode.getTextureNode();
    try {
      const { denoise } = await import("three/addons/tsl/display/DenoiseNode.js");
      if (denoise) { aoTex = denoise(aoTex, depthNode, normalNode, camera); postChain.push("denoise"); }
    } catch (e) { /* grain is acceptable; a broken chain is not */ }

    let outNode = aoTex.mul(colorNode);

    // --- screen-space reflections -----------------------------------------
    // Water is the one surface in these scenes with a genuinely low roughness,
    // and an environment map alone only ever gives it the sky. SSR lets the
    // river actually reflect the buildings standing beside it, which is the
    // difference between a blue polygon and water.
    try {
      const { ssr } = await import("three/addons/tsl/display/SSRNode.js");
      const metalNode = tsl.metalness ? scenePass.getTextureNode("metalness") : null;
      const roughNode = tsl.roughness ? scenePass.getTextureNode("roughness") : null;
      // metalnessNode is REQUIRED by SSRNode -- passing null threw and the whole
      // stage was silently skipped, which is why the chain came back as
      // "gtao -> denoise -> bloom" with no reflections at all.
      if (ssr && metalNode) {
        // SSR must be fed the raw PASS TEXTURE, not a computed node: it calls
        // .sample() internally, so handing it `ao.mul(color)` fails with
        // "this.colorNode.sample is not a function" and kills the render.
        // Reflections are traced against the unshaded colour buffer and then
        // added on top of the occluded image.
        const r = ssr(colorNode, depthNode, normalNode, metalNode, roughNode, camera);
        if (r.maxDistance) r.maxDistance.value = 260;
        if (r.opacity) r.opacity.value = 0.45;
        if (r.thickness) r.thickness.value = 0.15;
        outNode = outNode.add(r.mul(0.55));
        postChain.push("ssr");
      }
    } catch (e) { /* optional */ }

    // --- tilt-shift depth of field ----------------------------------------
    // Off by default and user-toggled. A shallow focal plane over a city model
    // is the classic architectural-maquette look and is genuinely striking, but
    // it also blurs geometry the viewer may be trying to READ. That is a
    // presentation choice, so it belongs to the user rather than being imposed.
    if (dofEnabled) {
      try {
        const { dof } = await import("three/addons/tsl/display/DepthOfFieldNode.js");
        // dof() wants a VIEW-Z node, not the depth texture: the signature is
        // (node, viewZNode, focusDistance, focalLength, bokehScale). Handing it
        // the depth texture focuses on nothing.
        if (dof && scenePass.getViewZNode) {
          const focus = camera.position.distanceTo(controls.target);
          outNode = dof(outNode, scenePass.getViewZNode(), focus, 0.12, 3.2);
          postChain.push("dof");
        }
      } catch (e) { /* optional */ }
    }

    // --- bloom -------------------------------------------------------------
    // Threshold high, strength low: daylight city, not neon. Only specular hits
    // on water and the brightest sunlit roofs should register.
    try {
      const { bloom } = await import("three/addons/tsl/display/BloomNode.js");
      if (bloom) { outNode = outNode.add(bloom(outNode, 0.20, 0.7, 0.94)); postChain.push("bloom"); }
    } catch (e) { /* optional */ }

    // --- antialiasing ------------------------------------------------------
    // TRAA in preference to FXAA. This scene is almost entirely long straight
    // roof edges at shallow angles, which is the worst case for a purely
    // spatial filter -- FXAA softens them but still crawls under camera motion.
    // Temporal accumulation resolves them properly. FXAA remains the fallback.
    // SMAA, not TRAA. TRAA needs a per-pixel VELOCITY buffer; handing it null
    // throws "Invalid value used as weak map key" from inside three and takes
    // the whole render down -- measured as a 22KB blank page. SMAA is purely
    // spatial, needs no motion vectors, and resolves long straight roof edges
    // far better than FXAA, which is the only edge this scene really has.
    try {
      const { smaa } = await import("three/addons/tsl/display/SMAANode.js");
      if (smaa) { outNode = smaa(outNode); postChain.push("smaa"); }
      else throw new Error("no smaa");
    } catch (e) {
      try {
        const { fxaa } = await import("three/addons/tsl/display/FXAANode.js");
        if (fxaa) { outNode = fxaa(outNode); postChain.push("fxaa"); }
      } catch (e2) { /* optional */ }
    }

    const pp = new THREE.PostProcessing(renderer);
    pp.outputNode = outNode;
    postProcessing = pp;
    console.log("post-processing:", postChain.join(" -> "));
  } catch (err) {
    console.warn("post-processing unavailable, rendering directly:", err);
    postProcessing = null;
  }
}

rebuildPostChain = buildPostChain;
await buildPostChain();

// Tilt-shift is a presentation choice, not a correctness one: it blurs geometry
// the viewer may be trying to read, so it is opt-in rather than imposed.
const btnTour = document.getElementById("btn-tour");
if (btnTour) {
  btnTour.addEventListener("click", () => {
    tourActive = !tourActive;
    btnTour.classList.toggle("active", tourActive);
    if (tourActive) {
      tourCurve = buildTour();
      controls.enabled = false;      // hand control to the tour, not both at once
    } else {
      controls.enabled = true;
    }
  });
}

const btnDof = document.getElementById("btn-dof");
if (btnDof) {
  btnDof.addEventListener("click", async () => {
    dofEnabled = !dofEnabled;
    btnDof.classList.toggle("active", dofEnabled);
    await rebuildPostChain();
  });
}


/**
 * Split one building mesh into roof faces and wall faces and give each a
 * plain material.
 *
 * Classification is by face normal: mostly-up is a roof, steeper is a wall.
 * Both get untextured MeshStandardMaterial, so the only shading cues are
 * geometry, the sun, and the environment -- which is exactly what makes a
 * clean prism city legible.
 */
// A nadir satellite image photographs no vertical surface, so there is no
// real facade data in the input at all. Walls used to carry a synthetic,
// procedurally drawn window grid to compensate -- disclosed in the HUD, but
// still an invented pattern, not data about the building. Walls now carry
// the same real per-vertex colour the roof does instead (see shadeBuildingPrisms
// below): the one real colour sample this building has, applied to the one
// surface that was never photographed. An inference, not a measurement, but
// a real one, grounded in this building's own data.


function shadeBuildingPrisms(mesh, mat) {
  const geom = mesh.geometry;
  const pos = geom.attributes.position;
  const idx = geom.index;
  const triCount = idx ? idx.count / 3 : pos.count / 3;
  const at = (i) => (idx ? idx.getX(i) : i);

  const roofIdx = [], wallIdx = [];
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  const ab = new THREE.Vector3(), ac = new THREE.Vector3(), n = new THREE.Vector3();

  for (let t = 0; t < triCount; t++) {
    const i0 = at(t * 3), i1 = at(t * 3 + 1), i2 = at(t * 3 + 2);
    a.fromBufferAttribute(pos, i0);
    b.fromBufferAttribute(pos, i1);
    c.fromBufferAttribute(pos, i2);
    ab.subVectors(b, a); ac.subVectors(c, a);
    n.crossVectors(ab, ac).normalize();
    (Math.abs(n.y) > 0.5 ? roofIdx : wallIdx).push(i0, i1, i2);
  }

  // Building colour comes from the GLB when the builder measured it: each
  // prism carries the median colour of its own roof, sampled from the
  // satellite image. That is real data about the building, so it is preferred
  // over any procedural tint.
  //
  // The positional fallback exists only for meshes built before roof sampling
  // -- a city in one flat grey reads as a single extruded blob, because with
  // no colour boundary between neighbours the only thing separating two
  // buildings of similar height is a shadow that may not exist.
  let colorAttr = geom.attributes.color || null;
  if (!colorAttr) {
    const colors = new Float32Array(pos.count * 3);
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      const key = (Math.floor(v.x / 18) * 73856093) ^ (Math.floor(v.z / 18) * 19349663);
      const r = ((key >>> 0) % 1000) / 1000;
      colors[i * 3]     = 0.93 + 0.07 * r;
      colors[i * 3 + 1] = 0.94 + 0.06 * r;
      colors[i * 3 + 2] = 0.90 + 0.10 * (1 - r);
    }
    colorAttr = new THREE.Float32BufferAttribute(colors, 3);
  }

  const mk = (indices, color, rough, m2, shade) => {
    if (!indices.length) return null;
    const g = new THREE.BufferGeometry();
    // Both attributes must be set on the NEW geometry. Setting the colour on
    // the original while the split geometries carry only position leaves a
    // material with vertexColors:true reading an attribute that isn't there,
    // which fails the whole render rather than just dropping the tint.
    g.setAttribute("position", pos);
    g.setAttribute("color", colorAttr);
    g.setIndex(indices);
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
      color, roughness: rough,
      metalness: (m2 && m2.metalness) || 0.0,
      envMapIntensity: (m2 && m2.envMapIntensity) || 0.5,
      vertexColors: true,
    }));
    m.castShadow = m.receiveShadow = true;
    return m;
  };

  // Roofs slightly lighter than walls: a flat roof faces the sky and picks up
  // more of it, so this follows the lighting rather than fighting it.
  // Roofs face the sky and take its colour; walls sit in shade and go cooler and
  // slightly darker. The multiplier rides on top of each building's measured
  // colour rather than replacing it.
  // Roofs face the sky and take more of it; walls sit in shade. Both ride on
  // the class material rather than replacing it, so a glass tower stays glassy
  // on both surfaces while still reading as roof-vs-wall.
  const m = mat || { roughness: 0.7, metalness: 0.0, color: 0xd0d4d8,
                     envMapIntensity: 0.7 };

  // A roof is the one building surface a nadir satellite image actually
  // photographs, top-down and undistorted -- unlike a wall, which the same
  // image only ever sees as a sliver of grazing-angle pixels or not at all.
  // When the GLB carries a real per-vertex UV for it (glb_export.py shares
  // the ground's own satellite texture), sample that instead of the flat
  // measured-median colour: real per-pixel roof detail -- AC units, roof
  // material, staining -- where before every roof was one flat swatch.
  // Falls back to the swatch for any mesh built before this UV existed.
  let roof;
  if (roofIdx.length && geom.attributes.uv && rgbTexture) {
    const rg = new THREE.BufferGeometry();
    rg.setAttribute("position", pos);
    rg.setAttribute("uv", geom.attributes.uv);
    rg.setIndex(roofIdx);
    rg.computeVertexNormals();
    roof = new THREE.Mesh(rg, new THREE.MeshStandardMaterial({
      map: rgbTexture,
      roughness: Math.min(1, m.roughness * 1.15),
      metalness: m.metalness || 0.0,
      envMapIntensity: m.envMapIntensity || 0.5,
    }));
    roof.castShadow = roof.receiveShadow = true;
  } else {
    roof = mk(roofIdx, m.color, Math.min(1, m.roughness * 1.15), m);
  }

  // WALLS get their own geometry with UVs derived from WORLD POSITION.
  //
  // The mesh carries planar (top-down) UVs, which are meaningless on a vertical
  // face: it spans almost no UV area, so one texel column stretches down the
  // whole wall. Parameterising across the face horizontally and up its height,
  // both in metres, puts one facade tile per storey regardless of building size.
  // Walls are tinted from the SAME per-vertex colour the roof carries when
  // the GLB has one -- the building's own measured colour, sampled from the
  // satellite image at its roof, not a fixed per-class swatch or a
  // procedurally drawn window grid. A nadir image never photographed the
  // wall itself, so this is an inference (this building's one real colour
  // sample, applied to its own walls) rather than a measurement -- but it
  // is a real inference from this building's own data, which a flat class
  // colour or a synthetic facade pattern is not. Falls back to the class
  // colour only for a mesh built before per-vertex colour existed.
  let wall = null;
  if (wallIdx.length) {
    const wp = [], wn = [], wc = [];
    const a3 = new THREE.Vector3(), b3 = new THREE.Vector3(), c3 = new THREE.Vector3();
    const ab3 = new THREE.Vector3(), ac3 = new THREE.Vector3(), n3 = new THREE.Vector3();
    const hasRealColor = !!geom.attributes.color;
    for (let t = 0; t < wallIdx.length; t += 3) {
      const i0 = wallIdx[t], i1 = wallIdx[t + 1], i2 = wallIdx[t + 2];
      a3.fromBufferAttribute(pos, i0);
      b3.fromBufferAttribute(pos, i1);
      c3.fromBufferAttribute(pos, i2);
      ab3.subVectors(b3, a3); ac3.subVectors(c3, a3);
      n3.crossVectors(ab3, ac3).normalize();
      for (const [v, i] of [[a3, i0], [b3, i1], [c3, i2]]) {
        wp.push(v.x, v.y, v.z);
        wn.push(n3.x, n3.y, n3.z);
        if (hasRealColor) {
          wc.push(colorAttr.getX(i), colorAttr.getY(i), colorAttr.getZ(i));
        }
      }
    }
    const wg = new THREE.BufferGeometry();
    wg.setAttribute("position", new THREE.Float32BufferAttribute(wp, 3));
    wg.setAttribute("normal", new THREE.Float32BufferAttribute(wn, 3));
    const wallMat = { roughness: m.roughness, metalness: m.metalness || 0.0,
                      envMapIntensity: m.envMapIntensity || 0.7 };
    if (hasRealColor) {
      wg.setAttribute("color", new THREE.Float32BufferAttribute(wc, 3));
      wallMat.vertexColors = true;
      wallMat.color = 0xffffff;
    } else {
      wallMat.color = new THREE.Color(m.color).multiplyScalar(0.94);
    }
    wall = new THREE.Mesh(wg, new THREE.MeshStandardMaterial(wallMat));
    wall.castShadow = wall.receiveShadow = true;
  }

  if (roof) mesh.parent.add(roof);
  if (wall) mesh.parent.add(wall);
  mesh.visible = false;
}

// --- Load terrain mesh ---
let groundMesh = null;
let rgbTexture = null, heatmapTexture = null, confidenceTexture = null, errorTexture = null, normalTexture = null;
let slopeTexture = null;
let aoTexture = null, roughnessTexture = null, metalnessTexture = null;

const textureLoader = new THREE.TextureLoader();
const gltfLoader = new GLTFLoader();

Promise.all([
  new Promise((res) => textureLoader.load(TEXTURE_RGB_URL, res, undefined, () => res(null))),
  new Promise((res) => textureLoader.load(TEXTURE_HEATMAP_URL, res, undefined, () => res(null))),
  new Promise((res) => textureLoader.load(TEXTURE_CONF_URL, res, undefined, () => res(null))),
  new Promise((res) => textureLoader.load(TEXTURE_ERR_URL, res, undefined, () => res(null))),
  new Promise((res) => textureLoader.load(TEXTURE_SLOPE_URL, res, undefined, () => res(null))),
  new Promise((res) => textureLoader.load(TEXTURE_NORMAL_URL, res, undefined, () => res(null))),
  new Promise((res) => textureLoader.load(TEXTURE_AO_URL, res, undefined, () => res(null))),
  new Promise((res) => textureLoader.load(TEXTURE_ROUGHNESS_URL, res, undefined, () => res(null))),
  new Promise((res) => textureLoader.load(TEXTURE_METALNESS_URL, res, undefined, () => res(null))),
]).then(([rgbTex, heatTex, confTex, errTex, slopeTex, normalTex, aoTex, roughTex, metalTex]) => {
  rgbTexture = rgbTex;
  heatmapTexture = heatTex;
  confidenceTexture = confTex;
  errorTexture = errTex;
  slopeTexture = slopeTex;
  normalTexture = normalTex;
  aoTexture = aoTex;
  roughnessTexture = roughTex;
  metalnessTexture = metalTex;
  // Anisotropic filtering: without it, a high-res texture on ground viewed at
  // a grazing angle (which is most of the frame in a terrain fly-through)
  // blurs to mush regardless of how sharp the source image is.
  const maxAniso = renderer.capabilities?.getMaxAnisotropy?.() ?? 8;
  for (const t of [rgbTex, heatTex, normalTex, aoTex, roughTex, metalTex]) {
    if (!t) continue;
    t.anisotropy = maxAniso;
    t.generateMipmaps = true;
    t.minFilter = THREE.LinearMipmapLinearFilter;
    t.magFilter = THREE.LinearFilter;
  }
  if (rgbTexture) rgbTexture.colorSpace = THREE.SRGBColorSpace;
  if (heatmapTexture) heatmapTexture.colorSpace = THREE.SRGBColorSpace;
  // normal maps are NOT color data -- must stay linear, not sRGB, or the
  // lighting math reads distorted (washed-out/inverted-looking) bump response
  // AO and roughness are data, not colour -- sRGB decoding would distort them
  if (normalTexture) normalTexture.colorSpace = THREE.NoColorSpace;
  if (aoTexture) aoTexture.colorSpace = THREE.NoColorSpace;
  if (roughnessTexture) roughnessTexture.colorSpace = THREE.NoColorSpace;
  if (metalnessTexture) metalnessTexture.colorSpace = THREE.NoColorSpace;

  gltfLoader.load(
    MESH_URL,
    (gltf) => {
      const obj = gltf.scene;
      obj.traverse((child) => {
        if (!child.isMesh) return;
        child.castShadow = true;
        child.receiveShadow = true;
        // GLB carries explicit node names from glb_export.py, so ground vs
        // buildings is identified directly rather than guessed from geometry.
        if (child.name === "ground" || child.parent?.name === "ground") {
          groundMesh = child;
          child.material = new THREE.MeshStandardMaterial({
            map: rgbTexture || null,
            normalMap: normalTexture || null,
            // Occlusion baked from the reconstructed heightfield (sky-view
            // factor), so contact shadows correspond to real geometry.
            aoMap: aoTexture || null,
            aoMapIntensity: 1.0,
            // Per-class roughness: water near-specular, vegetation fully
            // diffuse. Without this every surface responds to light identically.
            roughnessMap: roughnessTexture || null,
            roughness: roughnessTexture ? 1.0 : 0.92,  // map modulates this value
            // Water is given partial metalness so it reflects the environment
            // like a water surface; every other class stays at 0 (dielectric).
            metalnessMap: metalnessTexture || null,
            metalness: metalnessTexture ? 1.0 : 0.0,   // map modulates this value
            // Below 1.0 on purpose: the environment supplies shape and
            // directional response, but at full strength it also supplies most
            // of the colour, which washes the satellite texture out.
            envMapIntensity: 0.62,
            color: 0xdbe6f2,
          });
          // aoMap samples the second UV set by convention; this mesh has one
          // UV set shared by every map, so point it at that.
          if (aoTexture && child.geometry.attributes.uv &&
              !child.geometry.attributes.uv1) {
            child.geometry.setAttribute("uv1", child.geometry.attributes.uv);
          }
        } else {
          // Buildings are extruded prisms with real vertical walls. Roofs get
          // the real satellite texture where the GLB carries a UV for it
          // (shadeBuildingPrisms), because a nadir image genuinely
          // photographed that surface. Walls must NOT get the ground's
          // planar UV -- that would stretch a few roof texels down every
          // wall -- so they stay on tone plus the disclosed synthetic
          // facade instead.
          //
          // Roofs and walls are given slightly different tones on top of
          // that. That is what makes a block read as a solid volume rather
          // than a flat silhouette: the eye separates the two surfaces by
          // value, and the sun does the rest.
          if (child.name && child.name.startsWith("building_")) {
            // Material by height class. Building stock correlates strongly with
            // height at this scale -- tall structures are curtain-walled, low
            // ones masonry or render -- so the class is a defensible proxy for
            // material rather than an arbitrary recolouring. Without this every
            // volume returns light identically and the city reads as one piece
            // of extruded plastic.
            const CLASS_MAT = {
              // roughness, metalness, colour, envMapIntensity
              building_tall: [0.16, 0.55, 0xc3d2e2, 1.35],  // glass curtain wall
              building_mid:  [0.62, 0.04, 0xcfd4d8, 0.75],  // concrete / precast
              building_low:  [0.86, 0.00, 0xd7d3cc, 0.55],  // render / masonry
            };
            const [rough, metal, col, env] =
              CLASS_MAT[child.name] || CLASS_MAT.building_mid;
            shadeBuildingPrisms(child, { roughness: rough, metalness: metal,
                                         color: col, envMapIntensity: env });
          } else if (child.name === "canopy") {
            // Foliage: fully diffuse, no specular sheen -- leaves scatter.
            // Vary tone per clump. One flat green over every crown makes the
            // canopy read as a repeated asset; real foliage differs in species,
            // age and how much sky each crown sees. The variation is keyed to
            // position so it is stable across reloads rather than shimmering.
            {
              const cg = child.geometry;
              const cp = cg.attributes.position;
              const cc = new Float32Array(cp.count * 3);
              const v3 = new THREE.Vector3();
              for (let i = 0; i < cp.count; i++) {
                v3.fromBufferAttribute(cp, i);
                const key = (Math.floor(v3.x / 9) * 73856093) ^
                            (Math.floor(v3.z / 9) * 19349663);
                const t = ((key >>> 0) % 1000) / 1000;
                // darker, bluer green in shade; warmer, lighter in sun
                cc[i * 3]     = 0.20 + 0.16 * t;
                cc[i * 3 + 1] = 0.34 + 0.20 * t;
                cc[i * 3 + 2] = 0.16 + 0.12 * (1 - t);
              }
              cg.setAttribute("color", new THREE.Float32BufferAttribute(cc, 3));
            }
            child.material = new THREE.MeshStandardMaterial({
              color: 0xffffff, vertexColors: true,
              roughness: 1.0, metalness: 0.0,
              envMapIntensity: 0.5, flatShading: true,
            });
          } else if (child.name === "vehicles") {
            // Vehicles read as painted metal: smoother and more specular than
            // masonry, which is what separates them from the tarmac they sit on.
            child.material = new THREE.MeshStandardMaterial({
              color: 0xa6b2c0, roughness: 0.32, metalness: 0.40,
              envMapIntensity: 1.0,
            });
          } else if (child.name === "water") {
            // Water: smooth and slightly metallic so it reflects the sky
            // instead of just being a blue polygon.
            // Water reflects at grazing angles and absorbs when looked into --
            // that angular falloff is what makes a surface read as water rather
            // than as a blue polygon. MeshPhysicalMaterial's clearcoat plus a
            // low roughness and high environment weight approximates it without
            // a custom shader, and the environment now has a real sun disc for
            // it to catch.
            const WaterMat = THREE.MeshPhysicalMaterial || THREE.MeshStandardMaterial;
            child.material = new WaterMat({
              color: 0x24506e, roughness: 0.035, metalness: 0.30,
              envMapIntensity: 2.2,
              ...(THREE.MeshPhysicalMaterial
                  ? { clearcoat: 1.0, clearcoatRoughness: 0.04,
                      reflectivity: 1.0, ior: 1.333 }
                  : {}),
            });
            child.castShadow = false;
          } else {
            shadeBuildingPrisms(child);
          }
        }
      });
      scene.add(obj);

      const box = new THREE.Box3().setFromObject(obj);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      controls.target.copy(center);
      // Optional camera placement from the query string, so a particular view
      // can be reproduced exactly instead of being found by dragging:
      //   ?az=<deg around Y>&el=<deg above horizon>&dist=<multiple of scene size>
      // A low elevation is what shows building height; the default overhead
      // framing flattens exactly the relief this model exists to convey.
      const q = new URLSearchParams(location.search);
      const azDeg = parseFloat(q.get("az"));
      const elDeg = parseFloat(q.get("el"));
      const distMul = parseFloat(q.get("dist"));
      if (Number.isFinite(azDeg) || Number.isFinite(elDeg) || Number.isFinite(distMul)) {
        const az = THREE.MathUtils.degToRad(Number.isFinite(azDeg) ? azDeg : 45);
        const el = THREE.MathUtils.degToRad(
          THREE.MathUtils.clamp(Number.isFinite(elDeg) ? elDeg : 25, 1, 89));
        const r = maxDim * (Number.isFinite(distMul) ? distMul : 1.0);
        camera.position.set(
          center.x + r * Math.cos(el) * Math.sin(az),
          center.y + r * Math.sin(el),
          center.z + r * Math.cos(el) * Math.cos(az));
      } else {
        camera.position.set(center.x, center.y + maxDim * 0.6, center.z + maxDim * 0.8);
      }
      camera.far = Math.max(maxDim * 10, 20000); // must stay beyond the Sky sphere (scale 15000) or it gets clipped
      camera.updateProjectionMatrix();
      controls.update();

      // Near/far pushed well past the scene's own extent: at the old 0.35/2.2
      // factors, the default camera (~1.0x maxDim out) had most of the city
      // itself sitting inside the fogged band, not just the horizon beyond
      // it -- confirmed on a real build, where the ground texture and most
      // buildings were washed out grey even at the default view. Fog should
      // hide the ground plane's far edge, not the model.
      scene.fog.near = maxDim * 1.3;
      scene.fog.far = maxDim * 4.5;

      // Shadow camera: centered on the mesh (not the world origin), frustum
      // sized to the actual scene extent with margin, near/far spanning the
      // light-to-ground distance -- see the sunLight declaration above for why.
      const shadowHalfExtent = maxDim * 0.7;
      sunLight.position.copy(center).addScaledVector(sunDir, maxDim * 2);
      sunLight.target.position.copy(center);
      sunLight.shadow.camera.left = -shadowHalfExtent;
      sunLight.shadow.camera.right = shadowHalfExtent;
      sunLight.shadow.camera.top = shadowHalfExtent;
      sunLight.shadow.camera.bottom = -shadowHalfExtent;
      sunLight.shadow.camera.near = maxDim * 0.5;
      sunLight.shadow.camera.far = maxDim * 4;
      sunLight.shadow.camera.updateProjectionMatrix();
      sunLight.target.updateMatrixWorld();

      // Provenance in the HUD, not just the numbers. A viewer looking at a
      // 3D city has no way to tell a measured height from a plausible one, so
      // the scene states which tier it is: heights calibrated against shadow
      // geometry, or a relative field with no metric meaning.
      const lines = [
        `verts: ${countVerts(obj)}`,
        `bbox: ${size.x.toFixed(0)} x ${size.y.toFixed(0)} x ${size.z.toFixed(0)} m`,
      ];
      if (SCENE_META) {
        // Single-image builds (build_city_image.py) carry no tile/view/
        // off-nadir metadata -- those only exist on the multi-view archive
        // path. Printing them anyway renders literal "undefined"/"null" in
        // the HUD, which is worse than omitting a line the scene never had.
        if (SCENE_META.tile !== undefined && SCENE_META.view !== undefined) {
          lines.push(`tile ${SCENE_META.tile} - ${SCENE_META.view}`);
        } else if (SCENE_META.source_image) {
          const name = String(SCENE_META.source_image).split(/[\\/]/).pop();
          lines.push(`source: ${name}`);
        }
        if (SCENE_META.off_nadir_deg != null || SCENE_META.gsd_m != null) {
          const bits = [];
          if (SCENE_META.off_nadir_deg != null) bits.push(`${SCENE_META.off_nadir_deg}° off-nadir`);
          if (SCENE_META.gsd_m != null) bits.push(`${SCENE_META.gsd_m} m/px`);
          lines.push(bits.join(", "));
        }
        if (SCENE_META.sun_elevation_deg != null || SCENE_META.sun_azimuth_deg != null) {
          const bits = [];
          if (SCENE_META.sun_elevation_deg != null) bits.push(`${SCENE_META.sun_elevation_deg}° el`);
          if (SCENE_META.sun_azimuth_deg != null) bits.push(`${SCENE_META.sun_azimuth_deg}° az (estimated from shadows)`);
          lines.push(`sun ${bits.join(" / ")}`);
        }
        lines.push(
          `heights: tier ${SCENE_META.tier}` +
            (SCENE_META.shadow_samples ? ` (${SCENE_META.shadow_samples} shadows)` : ""),
          `${SCENE_META.buildings_extruded} buildings extruded`,
          `walls: this building's own measured roof colour (nadir imagery has no facade pixels to sample directly)`);
      }
      document.getElementById("stats").textContent = lines.join("\n");

      document.getElementById("loading").style.display = "none";
      document.getElementById("ui").style.display = "block";
      calibrateFloodRange();
    },
    undefined,
    (err) => {
      document.getElementById("loading").textContent =
        "Failed to load mesh at " + MESH_URL + " -- run mesh_generation.py first and update MESH_URL.";
      console.error(err);
    }
  );
});

// --- Live hover readout: real confidence/error values under the cursor ---
//
// Deliberately CPU canvas pixel-reads, not a GPU shader or a stored
// per-vertex grid: terrain_confidence_raw.png / terrain_error_raw.png are
// exact linear encodings build_city.py writes specifically for this (see its
// comments there), so a plain 2D canvas getImageData() at the hit point's UV
// is an exact, simple readout -- no shader round-trip, no interpolation
// scheme to keep in sync with the mesh separately from what the texture
// already says.
let confRawCtx = null, confRawSize = [0, 0];
let errRawCtx = null, errRawSize = [0, 0];

function _loadRawSampler(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = img.naturalWidth;
      c.height = img.naturalHeight;
      const ctx = c.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);
      resolve({ ctx, size: [img.naturalWidth, img.naturalHeight] });
    };
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

Promise.all([_loadRawSampler(TEXTURE_CONF_RAW_URL), _loadRawSampler(TEXTURE_ERR_RAW_URL)])
  .then(([conf, err]) => {
    if (conf) { confRawCtx = conf.ctx; confRawSize = conf.size; }
    if (err) { errRawCtx = err.ctx; errRawSize = err.size; }
  });

function sampleRawAt(ctx, size, uv) {
  // uv is Three.js convention: (0,0) bottom-left, (1,1) top-right. Canvas
  // pixel rows run top-down, so the v axis flips; u does not.
  if (!ctx || !uv) return null;
  const [w, h] = size;
  const x = Math.min(w - 1, Math.max(0, Math.round(uv.x * (w - 1))));
  const y = Math.min(h - 1, Math.max(0, Math.round((1 - uv.y) * (h - 1))));
  const d = ctx.getImageData(x, y, 1, 1).data;
  return d;
}

function realCoordsAt(worldX, worldZ) {
  // Same convention the building-record matcher above already uses (see its
  // comment on scene X/east, Z/south): scene coordinates are the real map
  // coordinates minus the scene's own origin corner, so the inverse is a
  // plain translation back -- no re-derivation, just undoing that shift.
  // origin_x/origin_y come directly (build_city.py scenes) or from the
  // affine transform's c/f coefficients (build_city_image.py scenes, added
  // 2026-09-20 specifically so this could exist).
  if (!SCENE_META) return null;
  let originX = SCENE_META.origin_x, originY = SCENE_META.origin_y;
  if ((originX === undefined || originY === undefined) && SCENE_META.affine_transform) {
    originX = SCENE_META.affine_transform[2];
    originY = SCENE_META.affine_transform[5];
  }
  if (originX === undefined || originY === undefined || originX === null || originY === null) {
    return null;   // this scene genuinely has no georeferencing -- say nothing, don't guess
  }
  return { easting: worldX + originX, northing: worldZ + originY };
}

function confidenceAt(uv) {
  const d = sampleRawAt(confRawCtx, confRawSize, uv);
  if (!d) return null;
  return d[0] / 255;   // build_city.py: raw grayscale, linear [0,1] -> [0,255]
}

function errorMAt(uv) {
  // build_city.py encodes (metres + 100) * 100 as an unsigned 16-bit int
  // split across two 8-bit channels: R = high byte, G = low byte, B = 1 if
  // this pixel has ground truth at all (0 means "no truth here", not a real
  // -100m reading). Exact, byte-for-byte -- no reliance on how a browser
  // happens to decode 16-bit-per-channel PNGs, which is not spec-guaranteed.
  const d = sampleRawAt(errRawCtx, errRawSize, uv);
  if (!d || d[2] === 0) return null;
  const encoded = d[0] * 256 + d[1];
  return encoded / 100.0 - 100.0;
}

const hoverBadge = document.createElement("div");
hoverBadge.id = "hover-readout";
hoverBadge.style.cssText =
  "position:fixed;pointer-events:none;display:none;z-index:50;" +
  "background:rgba(10,14,20,0.85);color:#cde;border:1px solid #345;" +
  "border-radius:4px;padding:4px 8px;font:12px monospace;white-space:pre;";
document.body.appendChild(hoverBadge);

renderer.domElement.addEventListener("pointermove", (e) => {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(scene.children, true)
    .filter((h) => h.object.isMesh && h.object.visible);
  if (!hits.length) { hoverBadge.style.display = "none"; return; }

  const hit = hits[0];
  const conf = hit.uv ? confidenceAt(hit.uv) : null;
  const err = hit.uv ? errorMAt(hit.uv) : null;
  const coords = realCoordsAt(hit.point.x, hit.point.z);

  if (conf === null && err === null && coords === null) {
    hoverBadge.style.display = "none";
    return;
  }

  const lines = [];
  if (coords !== null) {
    lines.push(`E ${coords.easting.toFixed(1)}  N ${coords.northing.toFixed(1)}`);
  }
  if (conf !== null) lines.push(`confidence  ${(conf * 100).toFixed(0)}%`);
  if (err !== null) lines.push(`error       ${err >= 0 ? "+" : ""}${err.toFixed(2)} m`);
  hoverBadge.textContent = lines.join("\n");
  hoverBadge.style.left = (e.clientX + 14) + "px";
  hoverBadge.style.top = (e.clientY + 14) + "px";
  hoverBadge.style.display = "block";
});

renderer.domElement.addEventListener("pointerleave", () => {
  hoverBadge.style.display = "none";
});

function countVerts(obj) {
  let n = 0;
  obj.traverse((c) => { if (c.isMesh) n += c.geometry.attributes.position.count; });
  return n;
}

// --- Panel collapse: the tool panel is a HUD over the model, not a
// permanent fixture -- a viewer wanting an unobstructed look at what was
// just built should be able to get it in one click, not by shrinking the
// browser window.
document.getElementById("btn-collapse").addEventListener("click", () => {
  const el = document.getElementById("ui");
  const nowCollapsed = el.classList.toggle("collapsed");
  document.getElementById("btn-collapse").innerHTML = nowCollapsed ? "&#9633;" : "&#8722;";
  document.getElementById("btn-collapse").title = nowCollapsed ? "Expand panel" : "Collapse panel";
});

// --- RGB / Heatmap toggle ---
document.getElementById("btn-rgb").addEventListener("click", () => setTextureMode("rgb"));
document.getElementById("btn-heatmap").addEventListener("click", () => setTextureMode("heatmap"));
document.getElementById("btn-conf").addEventListener("click", () => setTextureMode("confidence"));
document.getElementById("btn-err").addEventListener("click", () => setTextureMode("error"));

function setTextureMode(mode) {
  if (!groundMesh) return;
  const byMode = { rgb: rgbTexture, heatmap: heatmapTexture,
                   confidence: confidenceTexture, error: errorTexture,
                   slope: slopeTexture };
  // Fall back to RGB rather than returning early: a missing diagnostic
  // raster should still leave a usable scene on screen, not a dead button.
  const tex = byMode[mode] || rgbTexture;
  if (!tex) return;
  groundMesh.material.map = tex;
  groundMesh.material.needsUpdate = true;
  document.getElementById("btn-rgb").classList.toggle("active", mode === "rgb");
  document.getElementById("btn-heatmap").classList.toggle("active", mode === "heatmap");
  const cb = document.getElementById("btn-conf");
  if (cb) cb.classList.toggle("active", mode === "confidence");
  const eb = document.getElementById("btn-err");
  if (eb) eb.classList.toggle("active", mode === "error");
  // Confidence is a diagnostic view, not a lit scene: a red patch means the
  // imagery barely constrains the height there, and shading it would make that
  // depend on where the sun happens to be.
  const sb = document.getElementById("btn-slope");
  if (sb) sb.classList.toggle("active", mode === "slope");
  const diag = (mode === "confidence" || mode === "error" || mode === "slope");
  groundMesh.material.envMapIntensity = diag ? 0.0 : 0.62;
  groundMesh.material.roughness = diag ? 1.0 : (roughnessTexture ? 1.0 : 0.92);
  scene.traverse((o2) => {
    if (o2.isMesh && o2 !== groundMesh) o2.visible = !diag;
  });
  const note = document.getElementById("measure-panel");
  if (note && mode === "confidence") {
    note.textContent = "Confidence: green = views agree, height well constrained. "
      + "Red = weak photometric support (flat roof, shadow, water, single view). "
      + "This is the plane sweep's own NCC, not a model guess.";
  } else if (note && mode === "error") {
    // The overlay only exists where reference data does. Saying so is the point:
    // an empty overlay on an arbitrary upload could be mistaken for agreement.
    const v = SCENE_META && SCENE_META.validation;
    if (!errorTexture || !v) {
      note.textContent = "No reference data available for this scene, so no "
        + "validation overlay can be shown. This view is only available for "
        + "tiles with LiDAR ground truth.";
    } else {
      note.textContent = "Predicted minus LiDAR. Red = built too tall, "
        + "blue = too short, pale = agreement. Grey border is outside the "
        + "reference extent. RMSE " + v.rmse_m + " m, bias " + v.bias_m
        + " m over the central " + v.covers_m + " m. Scale +/-"
        + v.scale_limit_m + " m.";
    }
  }
}

// --- Click-to-measure ---
let measureActive = false;
let measurePoints = [];
const measureMarkers = [];
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

document.getElementById("btn-measure").addEventListener("click", () => {
  measureActive = !measureActive;
  document.getElementById("btn-measure").classList.toggle("active", measureActive);
  if (measureActive) {
    clearMeasure();
    document.getElementById("measure-panel").textContent = "Click a building to read its height.";
  }
});

document.getElementById("btn-reset").addEventListener("click", () => {
  clearMeasure();
  if (groundMesh) {
    const box = new THREE.Box3().setFromObject(groundMesh);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    controls.target.copy(center);
    camera.position.set(center.x, center.y + size.y + Math.max(size.x, size.z) * 0.6,
                         center.z + Math.max(size.x, size.z) * 0.8);
    controls.update();
  }
});

function clearMeasure() {
  measurePoints = [];
  measureMarkers.forEach((m) => scene.remove(m));
  measureMarkers.length = 0;
}

let floodSeedMode = false;

// --- Annotation pins ---------------------------------------------------
//
// Persisted per-scene (localStorage keyed on BASE, the same scene identity
// every other per-scene lookup here already uses), so a pin dropped during
// one visit is still there after a reload -- a real, checkable record a
// disaster-response team could actually rely on, not a session-only toy.
let annotateActive = false;
let pins = [];
const pinMarkers = [];
const PIN_STORAGE_KEY = "depthwizard_pins:" + BASE;

function loadPins() {
  try {
    const raw = localStorage.getItem(PIN_STORAGE_KEY);
    pins = raw ? JSON.parse(raw) : [];
  } catch (e) { pins = []; }
}

function savePins() {
  try { localStorage.setItem(PIN_STORAGE_KEY, JSON.stringify(pins)); } catch (e) { /* storage unavailable -- pins still work this session */ }
}

function makePinSprite(text) {
  const canvas = document.createElement("canvas");
  canvas.width = 256; canvas.height = 64;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "rgba(20,14,10,0.88)";
  ctx.beginPath();
  ctx.roundRect(0, 0, 256, 64, 10);
  ctx.fill();
  ctx.strokeStyle = "#e0a05a"; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = "bold 20px sans-serif"; ctx.textBaseline = "middle";
  const label = text.length > 22 ? text.slice(0, 21) + "…" : text;
  ctx.fillText(label, 12, 32);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false });
  const spr = new THREE.Sprite(mat);
  spr.scale.set(24, 6, 1);
  spr.renderOrder = 10;
  return spr;
}

function renderPins() {
  pinMarkers.forEach((m) => scene.remove(m));
  pinMarkers.length = 0;
  for (const pin of pins) {
    const spr = makePinSprite(pin.text);
    spr.position.set(pin.x, pin.y + 6, pin.z);
    scene.add(spr);
    pinMarkers.push(spr);
  }
  const panel = document.getElementById("pin-panel");
  const exportBtn = document.getElementById("btn-pins-export");
  if (panel) {
    panel.style.display = pins.length ? "block" : "none";
    panel.innerHTML = pins.map((p, i) =>
      `<div style="display:flex;justify-content:space-between;gap:6px;padding:2px 0;">`
      + `<span>${p.text.replace(/</g, "&lt;")}</span>`
      + `<a href="#" data-i="${i}" class="pin-del" style="color:#e0a05a;">remove</a></div>`
    ).join("");
    panel.querySelectorAll(".pin-del").forEach((a) => {
      a.addEventListener("click", (e) => {
        e.preventDefault();
        pins.splice(parseInt(a.dataset.i, 10), 1);
        savePins();
        renderPins();
      });
    });
  }
  if (exportBtn) exportBtn.style.display = pins.length ? "inline-block" : "none";
}

document.getElementById("btn-annotate").addEventListener("click", () => {
  annotateActive = !annotateActive;
  document.getElementById("btn-annotate").classList.toggle("active", annotateActive);
  if (annotateActive) {
    measureActive = false; gcpActive = false; floodSeedMode = false; toolMode = null;
    document.getElementById("btn-measure").classList.remove("active");
    document.getElementById("btn-gcp").classList.remove("active");
    document.getElementById("btn-flood").classList.remove("active");
    document.getElementById("measure-panel").textContent =
      "Click anywhere to drop a labelled pin.";
  } else {
    document.getElementById("measure-panel").textContent = "Click a building to read its height.";
  }
});

document.getElementById("btn-pins-export").addEventListener("click", () => {
  const rows = [["text", "easting", "northing", "scene_x", "scene_y", "scene_z"]];
  for (const p of pins) {
    const rc = realCoordsAt(p.x, p.z) || {};
    rows.push([p.text, rc.easting ?? "", rc.northing ?? "", p.x, p.y, p.z]);
  }
  const csv = rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "depthwizard_pins.csv";
  a.click();
  URL.revokeObjectURL(a.href);
});

loadPins();
renderPins();

renderer.domElement.addEventListener("click", (event) => {
  if (toolMode) { handleToolClick(event); return; }
  if (annotateActive) {
    pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(scene.children, true)
      .filter((h) => h.object.isMesh && h.object.visible && h.object !== floodMeshObj);
    if (hits.length === 0) return;
    const p = hits[0].point.clone();
    const text = window.prompt("Note for this location:", "");
    if (text === null || text.trim() === "") return;   // cancelled or empty -- drop nothing
    pins.push({ x: p.x, y: p.y, z: p.z, text: text.trim() });
    savePins();
    renderPins();
    return;
  }
  if (!measureActive && !gcpActive && !floodSeedMode) return;
  pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);

  // Pick against EVERYTHING, not just the ground. The previous version
  // intersected groundMesh alone, so clicking a building never registered a hit
  // on the building at all -- it silently fell through to the terrain behind or
  // beneath it, and then asked for a second click.
  const hits = raycaster.intersectObjects(scene.children, true)
    .filter((h) => h.object.isMesh && h.object.visible);
  if (hits.length === 0) return;

  const hit = hits[0];
  const p = hit.point.clone();

  // Height is measured from the terrain DIRECTLY BENEATH the clicked point, not
  // from the scene minimum: on sloping ground a single datum would report a
  // building on a rise as taller than one of identical size on a hollow. A ray
  // dropped from above the hit finds the local ground.
  let groundY = null;
  if (groundMesh) {
    const down = new THREE.Raycaster(
      new THREE.Vector3(p.x, p.y + 500, p.z), new THREE.Vector3(0, -1, 0));
    const g = down.intersectObject(groundMesh, false);
    if (g.length) groundY = g[g.length - 1].point.y;   // lowest = terrain, not a roof
  }

  clearMeasure();
  const marker = new THREE.Mesh(
    new THREE.SphereGeometry(Math.max(0.8, camera.position.distanceTo(p) * 0.003), 12, 12),
    new THREE.MeshBasicMaterial({ color: 0xff3355 })
  );
  marker.position.copy(p);
  scene.add(marker);
  measureMarkers.push(marker);

  const metric = SCENE_META && SCENE_META.height_is_metric;
  const unit = metric ? "m" : "units (relative)";
  const onBuilding = hit.object.userData && hit.object.userData.isBuilding;

  // ALWAYS report height above the terrain beneath the click, so the answer to
  // "how tall is that?" is the same quantity wherever you click. Ground and
  // roads are at the terrain, so they read 0.0 by construction.
  //
  // This branch used to print p.y for a ground hit, which is ABSOLUTE terrain
  // elevation in scene coordinates -- 0 to 90 m across this tile. Clicking a
  // road therefore reported "8.5 m", which looks exactly like a building
  // height and is not one.
  const panel = document.getElementById("measure-panel");
  if (groundY === null) {
    panel.textContent = "No terrain beneath that point.";
    return;
  }

  const h = Math.max(0, p.y - groundY);

  if (floodSeedMode) {
    if (setFloodSeedFromPoint(p)) {
      floodSeedMode = false;
      document.getElementById("btn-flood").classList.remove("active");
      document.getElementById("measure-panel").textContent =
        "Water source placed. Drag the Flood slider to raise the level.";
    }
    return;
  }

  // Ground control reuses THIS height, not a second measurement of its own.
  // The operator is asserting a real height for the thing the readout just
  // reported, so the pair must be (what we say, what it is) -- computing the
  // control point any other way would solve a scale between two quantities
  // that were never the same measurement.
  if (gcpActive) {
    if (h < 0.5 || !onBuilding) {
      document.getElementById("measure-panel").textContent =
        "Ground control needs a building, not ground level. Click a structure "
        + "whose real height you know.";
      return;
    }
    gcpAddPoint(p, h);
    return;
  }

  const isFlat = h < 0.5;   // at terrain level: ground, road, plaza, water
  let label;
  if (isFlat) {
    label = "Height: 0.0 " + unit + "  (ground level)";
  } else {
    label = "Height: " + h.toFixed(1) + " " + unit;
    if (metric && onBuilding) {
      label += "  (about " + Math.max(1, Math.round(h / 3.2)) + " storeys)";
    }
    if (!metric) {
      label += "  -- Tier C: vertical scale assumed, not measured";
    }
  }
  // Terrain elevation is still useful, but as a clearly separate figure.
  label += "   |   terrain elevation " + groundY.toFixed(1) + " " + unit;

  // Attach the evidence trail for the nearest recorded building.
  //
  // Matching is by world position rather than by an id baked into the mesh:
  // the GLB carries merged geometry with no per-building identifiers, and the
  // GeoJSON is in projected map coordinates, so the two are related through the
  // scene's own transform. A generous radius is used because the click lands on
  // a roof while the record's centroid is the footprint centre.
  if (onBuilding && BUILDING_RECORDS && BUILDING_RECORDS.length && SCENE_META) {
    const originX = SCENE_META.origin_x, originY = SCENE_META.origin_y;
    let best = null, bestD = Infinity;
    for (const r of BUILDING_RECORDS) {
      // Scene X runs east and scene Z runs south, matching the mesh builder:
      // build_ground_mesh emits z = -row*cell, and the raster origin is the
      // NORTH-west corner, so a point 355 m south of the origin sits at
      // z = -355 and at northing origin_y - 355. Scene z is therefore
      // (cy - origin_y) directly, with no negation.
      //
      // This was `-p.z`, which flips the sign and puts every record twice its
      // north-south offset away from itself. Measured against each record's own
      // position: 3 of 200 matched correctly, 192 fell outside the 40 m radius
      // so no evidence panel appeared at all, and 5 matched the WRONG building
      // at a mean 29.6 m. The reliability, provenance and conformal-interval
